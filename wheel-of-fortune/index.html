<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A customisable wheel of fortune — pick a category or write your own options, then spin for a random pick.">
<meta name="theme-color" content="#2f6df6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6df6'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cg stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 7v18M7 16h18'/%3E%3C/g%3E%3C/svg%3E">
<title>Wheel of Fortune</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --panel-2:#f6f8fa; --line:#d8dee6;
    --text:#1b2430; --muted:#6b7785; --accent:#2f6df6; --accent-soft:#e6eeff;
    --danger:#d6455a; --wheel-rim:#ffffff; --wheel-shadow:rgba(16,24,40,.20);
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12161c; --panel:#1a2027; --panel-2:#212932; --line:#2a333d;
      --text:#e7edf4; --muted:#94a1b0; --accent:#5b8cff; --accent-soft:#1e2c48;
      --danger:#f2637a; --wheel-rim:#1a2027; --wheel-shadow:rgba(0,0,0,.5);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;min-height:100%}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;
         background:var(--panel);border-bottom:1px solid var(--line);
         box-shadow:0 1px 3px rgba(16,24,40,.05);position:sticky;top:0;z-index:5}
  .home{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:7px;color:var(--muted);text-decoration:none;flex:0 0 auto;margin-right:-6px}
  .home:hover{background:var(--panel-2);color:var(--text)}
  .brand{font-weight:650;letter-spacing:-.2px;white-space:nowrap}
  .brand span{color:var(--muted);font-weight:400;font-size:12px}
  .spacer{flex:1}

  button.btn{font:inherit;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .12s,border-color .12s,color .12s}
  button.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  button.btn.danger:hover{color:var(--danger);border-color:var(--danger);background:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.btn:disabled:hover{background:var(--panel-2);border-color:var(--line);color:var(--text)}
  svg.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  main{flex:1;display:flex;align-items:flex-start;gap:22px;padding:22px;min-height:0}
  #left{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:16px}

  /* ---- wheel ---- */
  #wheelBox{position:relative;width:100%;max-width:460px;aspect-ratio:1;flex:0 0 auto}
  #wheel{display:block;width:100%;height:100%;cursor:pointer;border-radius:50%;
    filter:drop-shadow(0 10px 26px var(--wheel-shadow));touch-action:manipulation}
  #wheel:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
  #wheel.locked{cursor:not-allowed}
  #pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);
    width:26px;height:34px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(16,24,40,.35))}

  /* ---- result ---- */
  #result{width:100%;max-width:460px;min-height:52px;display:flex;align-items:center;
    justify-content:center;gap:10px;padding:11px 16px;border-radius:12px;text-align:center;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
    transition:border-color .2s,background .2s}
  #result.win{border-color:var(--accent);background:var(--accent-soft)}
  #result .lbl{font-size:11px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  #result .val{font-size:19px;font-weight:660;letter-spacing:-.3px;overflow-wrap:anywhere}
  #result .idle{color:var(--muted)}
  #result .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

  /* ---- options ---- */
  #options{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:13px 15px 15px}
  h2{margin:0 0 11px;font-size:11px;font-weight:650;letter-spacing:.7px;
     text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  h2 .count{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
  .opt{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .opt:last-child{margin-bottom:0}
  .opt .dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .opt .dot.blank{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .opt input{flex:1;min-width:0;font:inherit;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel-2);color:var(--text)}
  .opt input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:var(--panel)}
  .opt input::placeholder{color:var(--muted)}
  .opt .del{width:28px;height:28px;flex:0 0 auto;padding:0;justify-content:center;
    border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;
    color:var(--muted);display:inline-flex;align-items:center}
  .opt .del:hover{color:var(--danger);background:var(--panel-2);border-color:var(--line)}
  .opt .del.hidden{visibility:hidden;pointer-events:none}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:11px}

  /* ---- right panel ---- */
  aside{width:250px;flex:0 0 250px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden;position:sticky;top:68px}
  .sect{padding:13px 15px;border-bottom:1px solid var(--line)}
  .sect:last-child{border-bottom:0}
  .cats{display:flex;flex-direction:column;gap:5px}
  button.cat{font:inherit;text-align:left;color:var(--text);background:transparent;
    border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;
    display:flex;align-items:center;gap:9px;transition:background .12s,border-color .12s,color .12s}
  button.cat:hover{background:var(--panel-2);border-color:var(--line)}
  button.cat.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  button.cat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.cat .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  button.cat.active .c{color:var(--accent)}

  label.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
  label.chk input{accent-color:var(--accent);width:15px;height:15px}
  .row{display:flex;align-items:center;gap:8px;margin-top:10px}
  .row label{color:var(--muted);font-size:12.5px}
  .row input[type=number]{width:70px;font:inherit;padding:6px 8px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel-2);color:var(--text)}
  .row input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row input:disabled{opacity:.5;cursor:not-allowed}
  .stat{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
    color:var(--muted);margin-top:11px}
  .stat b{color:var(--text);font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
  .stat b.out{color:var(--danger)}
  .fullbtn{width:100%;justify-content:center;margin-top:10px}

  @media (max-width:840px){
    main{flex-direction:column-reverse;align-items:stretch;padding:16px;gap:16px}
    aside{width:100%;flex:0 0 auto;position:static}
    #left{width:100%}
    .cats{flex-direction:row;flex-wrap:wrap}
    button.cat{flex:1 1 130px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home" href="../" title="Back to all tools" aria-label="Back to all tools">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="brand">Wheel of&nbsp;Fortune <span>spin to decide</span></div>
    <div class="spacer"></div>
    <button class="btn" id="shuffleBtn" title="Shuffle the order of the options">
      <svg class="ic" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      Shuffle
    </button>
    <button class="btn danger" id="clearBtn" title="Remove every option">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
      Clear
    </button>
  </header>

  <main>
    <div id="left">
      <div id="wheelBox">
        <canvas id="wheel" role="button" tabindex="0"
                aria-label="Wheel of fortune. Click to spin."></canvas>
        <svg id="pointer" viewBox="0 0 26 34" aria-hidden="true">
          <path d="M13 33 L2.5 12 A11.6 11.6 0 1 1 23.5 12 Z" fill="#1b2430" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="13" cy="11" r="3.4" fill="#fff"/>
        </svg>
      </div>

      <div id="result" aria-live="polite">
        <span class="idle">Click the wheel to spin</span>
      </div>

      <section id="options">
        <h2>Options <span class="count" id="optCount"></span></h2>
        <div id="optList"></div>
        <p class="note">Type in the empty box to add an option — a new box appears below it.
          Up to 12 options fit on the wheel.</p>
      </section>
    </div>

    <aside>
      <div class="sect">
        <h2>Categories</h2>
        <div class="cats" id="cats"></div>
      </div>
      <div class="sect">
        <h2>Spins</h2>
        <label class="chk"><input type="checkbox" id="limitOn"> Limit the number of spins</label>
        <div class="row">
          <label for="limitNum">Allowed</label>
          <input type="number" id="limitNum" min="1" max="99" step="1" value="3" disabled>
        </div>
        <div class="stat"><span>Spins used</span><b id="spinStat">0</b></div>
        <button class="btn fullbtn" id="resetSpins">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Reset counter
        </button>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";

const MAX = 12;
const SPIN_MS = 5000;

const COLORS = [
  "#e5484d","#f76808","#ffb224","#8ac926","#30a46c","#12a594",
  "#00a2c7","#3e63dd","#7c5cd6","#b44ac0","#d6409f","#e93d82"
];

const CATEGORIES = [
  { id:"music",    name:"Music",    items:["Rock","Pop","Jazz","Hip-hop","Classical","Electronic"] },
  { id:"food",     name:"Food",     items:["Pizza","Sushi","Burgers","Pasta","Tacos","Ramen"] },
  { id:"activity", name:"Activity", items:["Hiking","Board games","Cinema","Bowling","Beach","Museum"] },
  { id:"movie",    name:"Movie night", items:["Comedy","Thriller","Sci-fi","Documentary","Animation","Horror"] },
  { id:"drinks",   name:"Drinks",   items:["Coffee","Tea","Beer","Wine","Cocktail","Lemonade"] },
  { id:"chores",   name:"Chores",   items:["Dishes","Laundry","Vacuum","Take out trash","Groceries","Cook dinner"] },
  { id:"travel",   name:"Travel",   items:["Rome","Tokyo","Lisbon","Reykjavik","Barcelona","Prague"] },
  { id:"decide",   name:"Yes or no", items:["Yes","No","Maybe","Ask again later","Definitely","No way"] }
];

// ---------- state ----------
// `opts` always ends with one empty string (the blank entry box) unless full.
let opts = [];
let activeCat = null;
let rotation = 0;
let anim = null;            // {start, delta, t0}
let raf = null;
let winner = -1;
let spinsUsed = 0;

const $ = (id) => document.getElementById(id);
const canvas = $("wheel");
const ctx = canvas.getContext("2d");

const filled = () => opts.map((v,i)=>({v:v.trim(), i})).filter(o=>o.v!=="");

function ensureBlank(){
  while(opts.length > 1 && opts[opts.length-1] === "" && opts[opts.length-2] === "") opts.pop();
  if(opts.length < MAX && opts[opts.length-1] !== "") opts.push("");
  if(opts.length === 0) opts.push("");
}

// ---------- colors ----------
function textOn(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#1b2430" : "#ffffff";
}
const colorAt = (i) => COLORS[i % COLORS.length];

// ---------- wheel ----------
function resize(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  if(canvas.width !== w || canvas.height !== w){ canvas.width = w; canvas.height = w; }
  draw();
}

function draw(){
  const S = canvas.width;
  if(!S) return;
  const cx = S/2, cy = S/2, R = S/2 - S*0.022;
  const css = getComputedStyle(document.documentElement);
  const rim = css.getPropertyValue("--wheel-rim").trim() || "#fff";
  const muted = css.getPropertyValue("--muted").trim() || "#888";

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,S,S);

  const list = filled();
  const n = list.length;

  // rim
  ctx.beginPath(); ctx.arc(cx,cy,R + S*0.018,0,Math.PI*2);
  ctx.fillStyle = rim; ctx.fill();

  if(n === 0){
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle = rim; ctx.fill();
    ctx.strokeStyle = muted; ctx.lineWidth = Math.max(1, S*0.004);
    ctx.setLineDash([S*0.03, S*0.02]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted;
    ctx.font = `500 ${Math.round(S*0.045)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Add some options", cx, cy);
    return;
  }

  const seg = (Math.PI*2)/n;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);

  for(let k=0;k<n;k++){
    const a0 = k*seg, a1 = a0+seg;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle = colorAt(list[k].i);
    ctx.fill();
    ctx.strokeStyle = rim; ctx.lineWidth = Math.max(1, S*0.006); ctx.stroke();

    if(n > 1 && k === winner){
      ctx.save();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fill();
      ctx.restore();
    }

    // label, running outward-in along the radius
    const avail = R * 0.74;
    let fs = Math.min(S*0.052, seg * R * 0.42);
    fs = Math.max(S*0.024, fs);
    ctx.save();
    ctx.rotate(a0 + seg/2);
    ctx.fillStyle = textOn(colorAt(list[k].i));
    ctx.font = `600 ${fs.toFixed(1)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(fit(list[k].v, avail), R - S*0.045, 0);
    ctx.restore();
  }
  ctx.restore();

  // hub
  const hr = Math.max(S*0.075, 26);
  ctx.beginPath(); ctx.arc(cx,cy,hr,0,Math.PI*2);
  ctx.fillStyle = rim; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.10)"; ctx.lineWidth = Math.max(1,S*0.003); ctx.stroke();
  ctx.fillStyle = spinning() ? muted : (css.getPropertyValue("--accent").trim() || "#2f6df6");
  ctx.font = `700 ${Math.round(hr*0.42)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(remaining() === 0 ? "DONE" : "SPIN", cx, cy);
}

function fit(text, max){
  if(ctx.measureText(text).width <= max) return text;
  let s = text;
  while(s.length > 1 && ctx.measureText(s + "…").width > max) s = s.slice(0,-1);
  return s + "…";
}

// ---------- spinning ----------
const spinning = () => anim !== null;
const easeOut = (p) => 1 - Math.pow(1 - p, 3.4);

function limitEnabled(){ return $("limitOn").checked; }
function limitValue(){ return Math.max(1, Math.min(99, parseInt($("limitNum").value,10) || 1)); }
function remaining(){ return limitEnabled() ? Math.max(0, limitValue() - spinsUsed) : Infinity; }

function spin(){
  if(filled().length < 2) return;
  if(remaining() <= 0) return;

  spinsUsed++;
  winner = -1;
  const turns = 4 + Math.random()*3;
  anim = { start: rotation, delta: turns*Math.PI*2 + Math.random()*Math.PI*2, t0: performance.now() };
  if(raf === null) raf = requestAnimationFrame(frame);
  syncSpinUI();
  setResult(null);
}

function frame(now){
  const p = Math.min(1, (now - anim.t0)/SPIN_MS);
  rotation = anim.start + anim.delta * easeOut(p);
  if(p >= 1){
    rotation %= Math.PI*2;
    anim = null; raf = null;
    settle();
  } else {
    raf = requestAnimationFrame(frame);
  }
  draw();
}

function settle(){
  const list = filled();
  if(!list.length){ draw(); return; }
  const seg = (Math.PI*2)/list.length;
  const POINTER = -Math.PI/2;                       // top of the wheel
  let a = (POINTER - rotation) % (Math.PI*2);
  if(a < 0) a += Math.PI*2;
  winner = Math.floor(a / seg) % list.length;
  setResult(list[winner]);
  syncSpinUI();
  draw();
}

function setResult(hit){
  const box = $("result");
  box.classList.toggle("win", !!hit);
  if(hit){
    box.innerHTML = "";
    const dot = document.createElement("span");
    dot.className = "dot"; dot.style.background = colorAt(hit.i);
    const wrap = document.createElement("span");
    const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = "Winner";
    const val = document.createElement("div"); val.className = "val"; val.textContent = hit.v;
    wrap.append(lbl, val);
    box.append(dot, wrap);
  } else if(spinning()){
    box.innerHTML = '<span class="idle">Spinning… click again to re-spin</span>';
  } else if(filled().length < 2){
    box.innerHTML = '<span class="idle">Add at least two options</span>';
  } else if(remaining() <= 0){
    box.innerHTML = '<span class="idle">No spins left — reset the counter to keep going</span>';
  } else {
    box.innerHTML = '<span class="idle">Click the wheel to spin</span>';
  }
}

// ---------- options list ----------
function renderOptions(){
  ensureBlank();
  const host = $("optList");
  host.innerHTML = "";
  opts.forEach((v,i) => host.appendChild(optRow(i,v)));
  $("optCount").textContent = filled().length + " / " + MAX;
}

function optRow(i, value){
  const row = document.createElement("div");
  row.className = "opt";

  const dot = document.createElement("span");
  dot.className = "dot";
  const del = document.createElement("button");
  del.className = "del";
  del.type = "button";
  del.title = "Remove";
  del.setAttribute("aria-label", "Remove option");
  del.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  del.addEventListener("click", () => { opts.splice(i,1); renderOptions(); refresh(); });

  const inp = document.createElement("input");
  inp.type = "text";
  inp.value = value;
  inp.maxLength = 40;
  inp.placeholder = "Add an option…";
  inp.setAttribute("aria-label", "Option " + (i+1));
  inp.addEventListener("input", () => {
    const wasBlank = opts[i].trim() === "";
    opts[i] = inp.value;
    paint();
    // typing in the trailing blank box grows the list by one
    if(wasBlank && inp.value.trim() !== "" && i === opts.length-1 && opts.length < MAX){
      opts.push("");
      $("optList").appendChild(optRow(opts.length-1, ""));
    }
    refresh();
  });
  inp.addEventListener("keydown", (e) => {
    if(e.key !== "Enter") return;
    e.preventDefault();
    const boxes = $("optList").querySelectorAll("input");
    if(boxes[i+1]) boxes[i+1].focus(); else inp.blur();
  });

  function paint(){
    const blank = opts[i].trim() === "";
    dot.style.background = blank ? "transparent" : colorAt(i);
    dot.classList.toggle("blank", blank);
    del.classList.toggle("hidden", blank && i === opts.length-1);
  }
  paint();

  row.append(dot, inp, del);
  return row;
}

// ---------- categories ----------
function renderCats(){
  const host = $("cats");
  host.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const b = document.createElement("button");
    b.className = "cat" + (activeCat === cat.id ? " active" : "");
    b.type = "button";
    b.innerHTML = '<span class="n"></span><span class="c"></span>';
    b.querySelector(".n").textContent = cat.name;
    b.querySelector(".c").textContent = Math.min(cat.items.length, MAX);
    b.addEventListener("click", () => {
      activeCat = cat.id;
      opts = cat.items.slice(0, MAX);
      winner = -1;
      renderCats();
      renderOptions();
      refresh();
    });
    host.appendChild(b);
  });
}

// ---------- spin panel ----------
function syncSpinUI(){
  const on = limitEnabled();
  $("limitNum").disabled = !on;
  const stat = $("spinStat");
  stat.textContent = on ? (spinsUsed + " / " + limitValue()) : String(spinsUsed);
  stat.classList.toggle("out", on && remaining() <= 0);
  const dead = filled().length < 2 || remaining() <= 0;
  canvas.classList.toggle("locked", dead && !spinning());
  canvas.setAttribute("aria-disabled", String(dead));
}

function refresh(){
  $("optCount").textContent = filled().length + " / " + MAX;
  syncSpinUI();
  if(!spinning()) setResult(winner >= 0 && filled()[winner] ? filled()[winner] : null);
  draw();
}

// ---------- wiring ----------
canvas.addEventListener("click", spin);
canvas.addEventListener("keydown", (e) => {
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); spin(); }
});

$("limitOn").addEventListener("change", () => { winner = -1; refresh(); });
$("limitNum").addEventListener("input", () => { winner = -1; refresh(); });
$("resetSpins").addEventListener("click", () => { spinsUsed = 0; winner = -1; refresh(); });

$("shuffleBtn").addEventListener("click", () => {
  const vals = filled().map(o=>o.v);
  for(let i=vals.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
  opts = vals; winner = -1;
  renderOptions(); refresh();
});

$("clearBtn").addEventListener("click", () => {
  opts = []; activeCat = null; winner = -1;
  renderCats(); renderOptions(); refresh();
});

window.addEventListener("resize", resize);
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(draw);
}

// ---------- boot ----------
activeCat = "food";
opts = CATEGORIES.find(c=>c.id==="food").items.slice(0, MAX);
renderCats();
renderOptions();
syncSpinUI();
setResult(null);
resize();
})();
</script>
</body>
</html>
