<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Three curtains, one question. Draw any of them — they all say yes.">
<meta name="theme-color" content="#1a0509">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a5121f'/%3E%3Cpath d='M16 25s-8-5-8-10.2A4.8 4.8 0 0 1 16 11a4.8 4.8 0 0 1 8 3.8C24 20 16 25 16 25z' fill='%23e8c47a'/%3E%3C/svg%3E">
<title>Will you go out with me?</title>
<style>
  /* A stage is a dark room by nature — this page commits to one look rather
     than following the viewer's light/dark preference. */
  :root{
    --stage:#12040a; --stage-2:#3a0a14;
    --velvet:#a5121f; --velvet-hi:#d6293a; --velvet-lo:#5e060f; --velvet-deep:#3d040c;
    --gold:#e8c47a; --gold-hi:#fbeec4; --gold-lo:#a97a33;
    --cream:#f7ecd9; --muted:#bfa78c;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--cream);background:var(--stage);-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(120% 70% at 50% -12%, var(--stage-2) 0%, rgba(58,10,20,0) 62%),
      radial-gradient(80% 50% at 50% 108%, rgba(232,196,122,.10) 0%, rgba(232,196,122,0) 70%);
    background-attachment:fixed}
  #app{display:flex;flex-direction:column;min-height:100%}

  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

  /* ---------- header ---------- */
  header{position:relative;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 14px}
  .home{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:50%;color:var(--gold);text-decoration:none;flex:0 0 auto;
    border:1px solid rgba(232,196,122,.35);background:rgba(0,0,0,.25);
    transition:background .15s,border-color .15s,color .15s}
  .home:hover{background:rgba(232,196,122,.16);border-color:var(--gold);color:var(--gold-hi)}
  .home svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .brand{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;
    color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .spacer{flex:1}
  button.btn{font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);background:rgba(0,0,0,.25);border:1px solid rgba(232,196,122,.35);
    border-radius:999px;padding:7px 15px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
  button.btn:hover{background:rgba(232,196,122,.16);border-color:var(--gold);color:var(--gold-hi);
    box-shadow:0 0 18px rgba(232,196,122,.22)}
  button.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ---------- the pelmet across the top of the house ---------- */
  .valance{position:fixed;inset:0 0 auto;height:clamp(56px,10vh,96px);z-index:5;pointer-events:none;
    background:
      linear-gradient(180deg, var(--velvet-hi) 0%, var(--velvet) 34%, var(--velvet-lo) 100%),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.34) 0%, rgba(255,255,255,.10) 2.6%, rgba(0,0,0,.34) 5.2%);
    background-blend-mode:multiply;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    /* scalloped hem: one semicircle bitten out of every 48px tile */
    -webkit-mask-image:radial-gradient(circle at 24px 100%, transparent 0 23px, #000 23.5px);
    mask-image:radial-gradient(circle at 24px 100%, transparent 0 23px, #000 23.5px);
    -webkit-mask-size:48px 100%;mask-size:48px 100%;
    -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x}
  .fringe{position:fixed;inset:0 0 auto;height:clamp(62px,10.6vh,104px);z-index:5;pointer-events:none}
  .fringe::after{content:"";position:absolute;inset:auto 0 0;height:9px;
    background:repeating-linear-gradient(90deg,
      var(--gold) 0 1.5px, rgba(232,196,122,.15) 1.5px 5px);
    opacity:.75;
    /* the fringe hangs in the dips, so it follows the scallop */
    -webkit-mask-image:radial-gradient(circle at 24px 0, #000 0 23px, transparent 23.5px);
    mask-image:radial-gradient(circle at 24px 0, #000 0 23px, transparent 23.5px);
    -webkit-mask-size:48px 100%;mask-size:48px 100%;
    -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x}

  /* ---------- the question ---------- */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,4.5vh,42px);padding:clamp(56px,11vh,104px) 20px 56px;text-align:center;
    position:relative;z-index:2}

  h1{margin:0;font-size:clamp(28px,6vw,54px);line-height:1.12;font-weight:600;
    letter-spacing:.01em;max-width:15ch;
    background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 46%,var(--gold-lo) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.65))}
  .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;
    color:var(--gold);opacity:.75}
  .rule::before,.rule::after{content:"";height:1px;width:clamp(38px,12vw,96px);
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .rule span{font-size:13px}
  .hint{margin:14px 0 0;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

  /* ---------- the three curtained arches ---------- */
  .doors{display:flex;gap:clamp(16px,4.5vw,52px);flex-wrap:wrap;justify-content:center;
    align-items:flex-end}

  .slot{position:relative;display:block;overflow:visible;padding:0;font:inherit;color:inherit;
    width:clamp(132px,25vw,196px);aspect-ratio:5/8;background:transparent;border:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .slot[disabled]{cursor:default}
  .slot:focus-visible{outline:none}
  .slot:focus-visible .frame{box-shadow:0 0 0 3px var(--gold),0 22px 44px rgba(0,0,0,.6)}

  /* gilded arch */
  .frame{position:absolute;inset:0;overflow:hidden;
    border:3px solid transparent;border-radius:48% 48% 8px 8px / 26% 26% 8px 8px;
    background:
      linear-gradient(var(--velvet-deep),var(--velvet-deep)) padding-box,
      linear-gradient(160deg,var(--gold-hi),var(--gold) 28%,var(--gold-lo) 62%,var(--gold-hi)) border-box;
    box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.7);
    transition:box-shadow .25s}
  .slot:hover:not(.open) .frame{box-shadow:0 0 26px rgba(232,196,122,.30),0 22px 46px rgba(0,0,0,.6),
    inset 0 0 40px rgba(0,0,0,.7)}

  /* what is behind the curtain */
  .reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;
    background:radial-gradient(78% 58% at 50% 42%,
      rgba(232,196,122,.30) 0%, rgba(232,196,122,.07) 46%, rgba(0,0,0,.55) 100%),
      var(--velvet-deep)}
  .reveal .yes{font-size:clamp(17px,3.6vw,31px);font-weight:600;letter-spacing:.01em;
    line-height:1.08;max-width:94%;overflow-wrap:break-word;
    color:var(--gold-hi);text-shadow:0 0 22px rgba(232,196,122,.6),0 2px 4px rgba(0,0,0,.7);
    transform:translateY(10px) scale(.86);opacity:0;
    transition:transform .5s cubic-bezier(.2,1.4,.45,1) .34s,opacity .4s .34s;
    padding:0 8px}
  .reveal .sparkle{font-size:15px;letter-spacing:.35em;opacity:0;color:var(--gold);
    transition:opacity .4s .5s}
  .slot.open .reveal .yes{transform:none;opacity:1}
  .slot.open .reveal .sparkle{opacity:.9}

  /* the curtain halves */
  .curtain{position:absolute;top:0;bottom:0;width:52%;
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.42) 0%, rgba(255,255,255,.13) 3.2%, rgba(0,0,0,.42) 6.6%),
      linear-gradient(180deg,var(--velvet-hi) 0%,var(--velvet) 42%,var(--velvet-lo) 100%);
    background-blend-mode:multiply;
    transition:transform .95s cubic-bezier(.55,.02,.2,1)}
  .curtain.l{left:0;transform-origin:left center;
    box-shadow:inset -14px 0 22px rgba(0,0,0,.5)}
  .curtain.r{right:0;transform-origin:right center;
    box-shadow:inset 14px 0 22px rgba(0,0,0,.5)}
  /* translate then squeeze, so a sliver of gathered fabric stays at each jamb */
  .slot.open .curtain.l{transform:translateX(-80%) scaleX(.88)}
  .slot.open .curtain.r{transform:translateX(80%) scaleX(.88)}

  /* gathered hem + gold fringe along the bottom of each curtain */
  .curtain::after{content:"";position:absolute;inset:auto 0 0;height:10px;
    background:repeating-linear-gradient(90deg,
      var(--gold) 0 1.5px, rgba(232,196,122,.12) 1.5px 4.5px);
    opacity:.6}

  /* the numbered plaque hanging on the arch */
  .plaque{position:absolute;left:50%;top:-15px;transform:translateX(-50%);
    min-width:38px;padding:4px 11px;border-radius:999px;
    font-size:14px;font-weight:600;letter-spacing:.06em;color:#2a1204;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold) 52%,var(--gold-lo));
    box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);
    z-index:2}

  /* pooled light on the boards under each arch */
  .slot::after{content:"";position:absolute;left:50%;bottom:-16px;width:118%;height:22px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);
    transition:background .4s}
  .slot.open::after{background:radial-gradient(closest-side,rgba(232,196,122,.28),transparent)}

  /* sparks when a curtain opens */
  .pop{position:absolute;left:50%;bottom:22%;pointer-events:none;font-size:18px;z-index:3;
    animation:rise 1.6s ease-out forwards}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    16%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-120px) scale(1.15)}
  }

  @media (prefers-reduced-motion:reduce){
    .curtain{transition:transform .01s}
    .reveal .yes,.reveal .sparkle{transition:none}
    .pop{display:none}
  }

  @media (max-width:560px){
    .doors{gap:14px}
    .slot{width:min(30vw,132px)}
  }
</style>
</head>
<body>

<div id="app">
  <div class="valance" aria-hidden="true"></div>
  <div class="fringe" aria-hidden="true"></div>

  <header>
    <a class="home" href="../" title="Back to all tools" aria-label="Back to all tools">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="brand">Three&nbsp;Doors</div>
    <div class="spacer"></div>
    <button class="btn" id="reset" type="button">Draw the curtains</button>
  </header>

  <main>
    <div>
      <h1 class="serif">Will you go out with me?</h1>
      <div class="rule" aria-hidden="true"><span>&#10022;</span></div>
      <p class="hint">Pick a curtain. Any curtain.</p>
    </div>

    <div class="doors" id="doors"></div>
  </main>
</div>

<script>
(function(){
  const DOORS = [
    { n: 1, yes: "Yes" },
    { n: 2, yes: "Yes!" },
    { n: 3, yes: "Absolutely yes" }
  ];
  const SPARKS = ["✦","✧","❤️","✨","\u{1F495}"];

  const doorsEl = document.getElementById("doors");

  DOORS.forEach(function(d){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "slot";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-label", "Curtain " + d.n);
    btn.innerHTML =
      '<span class="frame">' +
        '<span class="reveal" aria-hidden="true">' +
          '<span class="yes serif"></span>' +
          '<span class="sparkle">✦ ✦ ✦</span>' +
        '</span>' +
        '<span class="curtain l"></span>' +
        '<span class="curtain r"></span>' +
      '</span>' +
      '<span class="plaque serif" aria-hidden="true"></span>';
    btn.querySelector(".yes").textContent = d.yes;
    btn.querySelector(".plaque").textContent = d.n;
    btn.addEventListener("click", function(){ open(btn); });
    doorsEl.appendChild(btn);
  });

  function open(btn){
    if (btn.classList.contains("open")) return;   // already open — clicking again is a no-op
    btn.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    burst(btn);
  }

  function burst(btn){
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 7; i++){
      const s = document.createElement("span");
      s.className = "pop";
      s.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
      s.style.setProperty("--dx", (Math.random() * 86 - 43).toFixed(0) + "px");
      s.style.animationDelay = (0.4 + i * 0.07).toFixed(2) + "s";
      btn.appendChild(s);
      s.addEventListener("animationend", function(){ s.remove(); });
    }
  }

  document.getElementById("reset").addEventListener("click", function(){
    doorsEl.querySelectorAll(".slot").forEach(function(btn){
      btn.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    });
  });
})();
</script>

</body>
</html>
