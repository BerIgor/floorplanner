<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Draw a single-room floor plan and arrange furniture with intuitive drag-and-drop, right in your browser.">
<meta name="theme-color" content="#2f6df6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6df6'/%3E%3Cg fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'%3E%3Crect x='7' y='7' width='18' height='18'/%3E%3Cpath d='M7 17h7v8'/%3E%3C/g%3E%3C/svg%3E">
<title>Room Plan Editor</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --panel-2:#f6f8fa; --line:#d8dee6;
    --text:#1b2430; --muted:#6b7785; --accent:#2f6df6; --accent-soft:#e6eeff;
    --danger:#d6455a; --lock:#c8892a;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;
         background:var(--panel);border-bottom:1px solid var(--line);
         box-shadow:0 1px 3px rgba(16,24,40,.05);z-index:5}
  .home{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:7px;color:var(--muted);text-decoration:none;flex:0 0 auto;margin-right:-6px}
  .home:hover{background:var(--panel-2);color:var(--text)}
  .brand{font-weight:650;letter-spacing:-.2px;white-space:nowrap}
  .brand span{color:var(--muted);font-weight:400;font-size:12px}
  .group{display:flex;align-items:center;gap:6px}
  .sep{width:1px;height:26px;background:var(--line)}
  button.tool,button.btn{font:inherit;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .12s,border-color .12s,color .12s}
  button.tool:hover,button.btn:hover{background:#eaeef3}
  button.tool.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button.btn.danger:hover{color:var(--danger);border-color:#f0b8c1}
  button:disabled{opacity:.45;cursor:not-allowed}
  svg.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
  label.chk input{accent-color:var(--accent);width:15px;height:15px}
  .scale-wrap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .scale-wrap input{width:64px;font:inherit;padding:5px 7px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--text)}
  .spacer{flex:1}

  main{flex:1;display:flex;min-height:0}
  #stage{position:relative;flex:1;min-width:0;overflow:hidden;background:#fff}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;
    background:rgba(27,36,48,.88);color:#fff;padding:7px 14px;border-radius:20px;
    font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:70%;text-align:center}
  #hint.show{opacity:1}
  #renameBox{position:absolute;display:none;z-index:6;padding:4px 7px;text-align:center;outline:none;
    font:600 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);background:#fff;border:1.5px solid var(--accent);border-radius:7px;
    box-shadow:0 0 0 3px var(--accent-soft),0 4px 14px rgba(16,24,40,.16)}
  #zoombar{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 7px;box-shadow:var(--shadow)}
  #zoombar button{width:26px;height:26px;border:0;background:transparent;border-radius:6px;
    font-size:15px;cursor:pointer;color:var(--text);line-height:1}
  #zoombar button:hover{background:var(--panel-2)}
  #zoomval{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

  aside{width:286px;flex:0 0 286px;background:var(--panel);border-left:1px solid var(--line);
        display:flex;flex-direction:column;overflow-y:auto}
  .sect{padding:13px 15px;border-bottom:1px solid var(--line)}
  .sect h2{margin:0 0 11px;font-size:11px;font-weight:650;letter-spacing:.7px;
           text-transform:uppercase;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:20px 8px;text-align:center;line-height:1.65}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .row:last-child{margin-bottom:0}
  .row label{width:62px;flex:0 0 62px;color:var(--muted);font-size:12.5px}
  .row input[type=text],.row input[type=number]{flex:1;min-width:0;font:inherit;padding:6px 8px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text)}
  .row input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row input:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed}
  .pair{display:flex;gap:10px}
  .pair .row{flex:1 1 0;min-width:0;margin-bottom:0;gap:5px}
  .pair .row label{width:auto;flex:0 0 auto;min-width:13px}
  .pair .row input{min-width:0}
  .unit{color:var(--muted);font-size:12px;flex:0 0 auto}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:20px;cursor:grab;margin:0}
  .row input[type=range]:active{cursor:grabbing}
  .row input[type=range]:disabled{cursor:not-allowed;opacity:.45}
  .rotsteps{display:flex;gap:5px;flex:1;min-width:0}
  button.rotstep{flex:1;min-width:0;justify-content:center;padding:5px 0;font-size:12px;
    font-variant-numeric:tabular-nums}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel-2);margin-bottom:8px;
    cursor:pointer;user-select:none}
  .toggle.on{background:#fdf4e3;border-color:#e9cf9c;color:#7a5a15}
  .toggle span{display:inline-flex;align-items:center;gap:8px;font-size:13px}
  .swatches{display:flex;gap:7px;flex-wrap:wrap}
  .sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .sw.sel{border-color:var(--text)}
  .list{margin:-3px -5px;max-height:200px;overflow-y:auto}
  .item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
  .item:hover{background:var(--panel-2)}
  .item.sel{background:var(--accent-soft);color:#1a49b8}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .fullbtn{width:100%;justify-content:center;margin-top:4px}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
  .stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
  .note.warn{color:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home" href="../" title="Back to all tools" aria-label="Back to all tools">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="brand">Room&nbsp;Plan <span>Editor</span></div>

    <div class="group" id="tools">
      <button class="tool active" data-tool="select" title="Select and move">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 3l7 17 2.5-6.5L20 11z"/></svg>Select
      </button>
      <button class="tool" data-tool="room" title="Trace the room outline">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 20V9l6-5 5 4h7v12z"/></svg>Draw room
      </button>
      <button class="tool" data-tool="object" title="Add a rectangular object">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/></svg>Add object
      </button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button class="btn" id="btnUndo" title="Undo (Ctrl/Cmd+Z)" disabled>
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/></svg>Undo
      </button>
      <button class="btn" id="btnRedo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>
        <svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h3"/></svg>Redo
      </button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <label class="chk" title="Snap points to the grid"><input type="checkbox" id="snapGrid" checked>Grid snap</label>
    </div>

    <div class="sep"></div>

    <div class="scale-wrap" title="Size of one grid square">
      <span>Grid</span><input type="number" id="gridSize" value="10" min="1" max="200" step="1"><span>cm</span>
    </div>

    <div class="spacer"></div>

    <div class="group">
      <button class="btn" id="btnSave"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Save</button>
      <button class="btn" id="btnLoad"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Load</button>
      <button class="btn" id="btnPng"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-6 6-3-3-4 4"/></svg>PNG</button>
      <button class="btn danger" id="btnClear"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Reset</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <input id="renameBox" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <div id="hint"></div>
      <div id="zoombar">
        <button id="zOut" title="Zoom out">−</button>
        <div id="zoomval">100%</div>
        <button id="zIn" title="Zoom in">+</button>
        <button id="zFit" title="Fit to view">⤢</button>
      </div>
    </div>

    <aside>
      <div class="sect">
        <h2>Properties</h2>
        <div id="propBody"></div>
      </div>
      <div class="sect">
        <h2>Room</h2>
        <div id="roomStats"></div>
      </div>
      <div class="sect">
        <h2>Objects</h2>
        <div class="list" id="objlist"></div>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";

/* ======================================================================
   MODEL — all lengths are stored in CENTIMETRES.
   The room is ONE closed polygon: an array of corner points.
   Objects are named rectangles placed inside it.
   ====================================================================== */
const PX_PER_CM = 1;          // 1 cm = 1 px at zoom 1

const state = {
  room: { pts: [], locked:false, lockedSize:false, name:'Room', wall:12 },
  objects: [],                 // {id,name,x,y,w,h,color,locked,lockedSize}
  gridCm: 10,
  snapGrid: true,
  sel: null                    // {kind:'room'} | {kind:'vertex',i} | {kind:'edge',i} | {kind:'object',id}
};
let nextId = 1;
const uid = () => 'o' + (nextId++);
const COLORS = ['#dbe6ff','#dcf3e4','#fdeccd','#fadbdf','#ece0fb','#d9f1f5','#e8e8ec'];
const view = { x:0, y:0, z:1 };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const hintEl = document.getElementById('hint');
const propBody = document.getElementById('propBody');
const objList = document.getElementById('objlist');
const roomStats = document.getElementById('roomStats');
const zoomVal = document.getElementById('zoomval');

let tool = 'select';
let dpr = 1;
let drawPts = null;            // in-progress room outline
let hoverPt = null;

/* ---------------- coordinate helpers ---------------- */
const sx = v => (v - view.x) * PX_PER_CM * view.z;
const sy = v => (v - view.y) * PX_PER_CM * view.z;
const wx = p => p / (PX_PER_CM * view.z) + view.x;
const wy = p => p / (PX_PER_CM * view.z) + view.y;

const fmt = cm => {
  const r = Math.round(cm * 10) / 10;
  return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(1);
};
const clean = n => Math.round(n * 1e4) / 1e4;
const snapV = v => state.snapGrid ? Math.round(v / state.gridCm) * state.gridCm : v;
const normRot = d => { const n = Math.round(+d || 0) % 360; return n < 0 ? n + 360 : n; };
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function showHint(t, ms){
  hintEl.textContent = t; hintEl.classList.add('show');
  clearTimeout(showHint._t);
  if (ms !== 0) showHint._t = setTimeout(()=>hintEl.classList.remove('show'), ms||2600);
}
const hideHint = () => { clearTimeout(showHint._t); hintEl.classList.remove('show'); };

const hasRoom = () => state.room.pts.length >= 3;
const objById = id => state.objects.find(o => o.id === id) || null;

/* polygon area (cm²) via shoelace */
function polyArea(pts){
  let a = 0;
  for (let i=0, n=pts.length; i<n; i++){
    const p = pts[i], q = pts[(i+1)%n];
    a += p.x*q.y - q.x*p.y;
  }
  return Math.abs(a/2);
}
function polyPerimeter(pts){
  let s = 0;
  for (let i=0, n=pts.length; i<n; i++) s += dist(pts[i], pts[(i+1)%n]);
  return s;
}
function polyBounds(pts){
  if (!pts.length) return null;
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  pts.forEach(p => { a=Math.min(a,p.x); b=Math.min(b,p.y); c=Math.max(c,p.x); d=Math.max(d,p.y); });
  return {x:a,y:b,w:c-a,h:d-b};
}
function pointInPoly(pt, pts){
  let inside = false;
  for (let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    if (((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function distToSeg(p, a, b){
  const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
  if (!L2) return dist(p,a);
  let t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}

/* ======================================================================
   RECTILINEAR WALLS

   Every wall is horizontal or vertical. Wall i runs from pts[i] to pts[i+1],
   and pts[i].fix pins *that wall's length* against later edits.

   A closed loop cannot have independent wall lengths: the signed horizontal
   runs must sum to zero, and so must the vertical ones. So changing one
   length always forces another wall of the same orientation to absorb the
   difference — the job here is to pick one the user has not pinned.
   ====================================================================== */
const EPS = 1e-6;
const DEFAULT_WALL = 12;                       // cm, a typical internal partition
const wallCm = () => Math.max(0, +state.room.wall || 0);

/* The outline is the inside face, so the outer footprint is the outline grown
   by the wall thickness. Rectilinear makes this exact: a corner's outer point
   just takes the offset x of its vertical wall and the offset y of its
   horizontal one. */
function outerBounds(pts){
  const bb = polyBounds(pts);
  if (!bb) return null;
  const t = wallCm();
  return {x:bb.x-t, y:bb.y-t, w:bb.w+2*t, h:bb.h+2*t};
}
const wallEnds = (pts,i) => ({a:pts[i], b:pts[(i+1)%pts.length]});
function wallAxis(pts,i){
  const {a,b} = wallEnds(pts,i);
  return Math.abs(b.x-a.x) >= Math.abs(b.y-a.y) ? 'h' : 'v';
}
const wallLen = (pts,i) => { const {a,b}=wallEnds(pts,i); return Math.hypot(b.x-a.x, b.y-a.y); };
// +1 or -1: which way the wall runs along its own axis
function wallDir(pts,i){
  const {a,b} = wallEnds(pts,i), k = wallAxis(pts,i)==='h' ? 'x' : 'y';
  return b[k] >= a[k] ? 1 : -1;
}
const isPinned = (pts,i) => !!pts[i%pts.length].fix;

/* Snap a point so the wall leaving `from` is axis-aligned. */
function axisSnap(from, x, y){
  return Math.abs(x-from.x) >= Math.abs(y-from.y) ? {x, y:from.y} : {x:from.x, y};
}

/* Force a traced outline to be closed and rectilinear: square every segment,
   add a corner if the closing run needs an L, then drop degenerate walls. */
function rectify(raw){
  let pts = raw.map(p=>({x:clean(p.x), y:clean(p.y), fix:!!p.fix}));
  if (pts.length < 3) return pts;
  for (let i=1;i<pts.length;i++){
    const s = axisSnap(pts[i-1], pts[i].x, pts[i].y);
    pts[i].x = clean(s.x); pts[i].y = clean(s.y);
  }
  const last = pts[pts.length-1], first = pts[0];
  if (Math.abs(last.x-first.x) > EPS && Math.abs(last.y-first.y) > EPS){
    // the closing run is diagonal — bend it into two axis-aligned walls
    const lastAxis = Math.abs(last.x-pts[pts.length-2].x) >= Math.abs(last.y-pts[pts.length-2].y) ? 'h' : 'v';
    pts.push(lastAxis==='h' ? {x:last.x, y:first.y, fix:false} : {x:first.x, y:last.y, fix:false});
  }
  return dedupe(pts);
}

/* Drop zero-length walls and merge walls that carry straight on. */
function dedupe(pts){
  let out = pts.filter((p,i)=>{
    const q = pts[(i+1)%pts.length];
    return Math.abs(p.x-q.x) > EPS || Math.abs(p.y-q.y) > EPS;
  });
  if (out.length < 3) return pts;
  for (let i=0; i<out.length && out.length>3; ){
    const p = out[(i-1+out.length)%out.length], q = out[i], r = out[(i+1)%out.length];
    const straight = (Math.abs(p.x-q.x)<EPS && Math.abs(q.x-r.x)<EPS) ||
                     (Math.abs(p.y-q.y)<EPS && Math.abs(q.y-r.y)<EPS);
    // keep a pinned wall's start corner: removing it would merge that wall away
    if (straight && !q.fix){ out.splice(i,1); } else i++;
  }
  return out;
}

/* Move a corner, dragging the two neighbours just enough to keep both of its
   walls axis-aligned. */
function moveCorner(pts, i, x, y){
  const n = pts.length, p = pts[i];
  p.x = clean(x); p.y = clean(y);
  const prev = pts[(i-1+n)%n], next = pts[(i+1)%n];
  // the wall into p and the wall out of p each keep their own axis
  if (wallAxis(pts,(i-1+n)%n)==='h') prev.y = p.y; else prev.x = p.x;
  if (wallAxis(pts,i)==='h') next.y = p.y; else next.x = p.x;
}

/* The nearest wall parallel to wall i that is free to change length.
   Searched outward in both directions; ties go forward. */
function absorberFor(pts, i){
  const n = pts.length, ax = wallAxis(pts,i);
  for (let d=1; d<=Math.floor(n/2); d++){
    for (const j of [(i+d)%n, (i-d+n)%n]){
      if (j===i) continue;
      if (wallAxis(pts,j)===ax && !isPinned(pts,j)) return j;
    }
  }
  return -1;
}

/* Shift a cyclic run of corners along one axis. Because every wall strictly
   inside the run has *both* endpoints in it, only the two walls at the ends
   of the run change length. */
function shiftRun(pts, from, to, axis, delta){
  const n = pts.length, k = axis==='h' ? 'x' : 'y';
  for (let s=0, i=from%n; s<n; s++, i=(i+1)%n){
    pts[i][k] = clean(pts[i][k] + delta);
    if (i===to%n) break;
  }
}

/* Set wall i's length, letting the nearest unpinned parallel wall absorb it.
   Returns {ok, absorber} or {ok:false, reason}. */
function setWallLength(pts, i, L){
  const n = pts.length;
  if (isPinned(pts,i)) return {ok:false, reason:'pinned'};
  const cur = wallLen(pts,i);
  const delta = L - cur;
  if (Math.abs(delta) < EPS) return {ok:true, absorber:-1};
  const j = absorberFor(pts,i);
  if (j < 0) return {ok:false, reason:'blocked'};
  const axis = wallAxis(pts,i), dir = wallDir(pts,i);
  // forward: push pts[i+1]..pts[j]; backward: pull pts[j+1]..pts[i] the other way
  const forward = ((j - i + n) % n) <= ((i - j + n) % n);
  if (forward) shiftRun(pts, i+1, j, axis, delta*dir);
  else         shiftRun(pts, j+1, i, axis, -delta*dir);
  return {ok:true, absorber:j};
}

/* Removing a corner leaves a diagonal where two walls merge, so re-square the
   outline afterwards. That can collapse a jog entirely — which is the point. */
function removeCorner(i){
  const before = state.room.pts.length;
  const next = rectify(state.room.pts.filter((_,k)=>k!==i));
  if (next.length < 4){ showHint('Removing that corner would flatten the room.'); return false; }
  state.room.pts = next;
  showHint(next.length < before
    ? `Corner removed — the outline squared up to ${next.length} corners.`
    : 'Corner removed.');
  return true;
}

/* Names of the pinned walls that are blocking wall i, for the error message. */
function blockingWalls(pts, i){
  const ax = wallAxis(pts,i), out = [];
  for (let j=0;j<pts.length;j++) if (j!==i && wallAxis(pts,j)===ax && isPinned(pts,j)) out.push(j+1);
  return out;
}

/* Replace a wall's middle with a rectangular notch (4 new corners), so the
   outline stays rectilinear and strictly alternating. */
function addJog(pts, i){
  const n = pts.length, {a,b} = wallEnds(pts,i);
  const axis = wallAxis(pts,i), L = wallLen(pts,i);
  if (L < 8) return false;
  const depth = Math.min(30, L*0.25);
  // push the notch towards the inside of the room
  const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  const nrm = axis==='h' ? {x:0,y:1} : {x:1,y:0};
  let d = depth;
  if (!pointInPoly({x:mid.x+nrm.x*2, y:mid.y+nrm.y*2}, pts)) d = -depth;
  const t1 = 0.35, t2 = 0.65;
  const at = t => ({x:clean(a.x+(b.x-a.x)*t), y:clean(a.y+(b.y-a.y)*t)});
  const p1 = at(t1), p2 = at(t2);
  const off = p => ({x:clean(p.x+nrm.x*d), y:clean(p.y+nrm.y*d), fix:false});
  pts.splice(i+1, 0, {x:p1.x,y:p1.y,fix:false}, off(p1), off(p2), {x:p2.x,y:p2.y,fix:false});
  return true;
}

/* ---------------- canvas sizing ---------------- */
function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = stage.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width*dpr));
  cv.height = Math.max(1, Math.round(r.height*dpr));
  cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
  draw();
}
window.addEventListener('resize', resize);

/* ======================================================================
   RENDER
   ====================================================================== */
function draw(){
  const W = cv.width/dpr, H = cv.height/dpr;
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  drawGrid(W,H);
  if (hasRoom()) drawRoom();
  state.objects.forEach(drawObject);
  if (drawPts) drawOutlinePreview();
  drawSelection();
  ctx.restore();
}

function drawGrid(W,H){
  const step = state.gridCm * PX_PER_CM * view.z;
  if (step < 3) return;
  let mul = 1;
  while (step*mul < 7) mul *= 2;
  const minor = step*mul, major = minor*5;
  function lines(sp,color){
    ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1;
    let x0 = sx(0)%sp;
    for(let x=x0;x<W;x+=sp){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);}
    for(let x=x0-sp;x>0;x-=sp){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);}
    let y0 = sy(0)%sp;
    for(let y=y0;y<H;y+=sp){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);}
    for(let y=y0-sp;y>0;y-=sp){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);}
    ctx.stroke();
  }
  lines(minor,'#eef1f5');
  lines(major,'#dde3ea');
}

function drawRoom(){
  const pts = state.room.pts;
  const locked = state.room.locked;
  const roomPath = () => {
    ctx.beginPath();
    pts.forEach((p,i) => i ? ctx.lineTo(sx(p.x),sy(p.y)) : ctx.moveTo(sx(p.x),sy(p.y)));
    ctx.closePath();
  };
  roomPath();
  ctx.fillStyle = '#f7f9fc';
  ctx.fill();

  /* The outline IS the inner face of the walls, so every length the user sees
     is an internal one. Canvas can only centre a stroke, so stroke at double
     width and clip away everything inside the room — what is left is a wall of
     the right thickness sitting entirely outside the outline. */
  const W = cv.width/dpr, H = cv.height/dpr;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  pts.forEach((p,i) => i ? ctx.lineTo(sx(p.x),sy(p.y)) : ctx.moveTo(sx(p.x),sy(p.y)));
  ctx.closePath();
  ctx.clip('evenodd');
  roomPath();
  ctx.strokeStyle = locked ? '#c8892a' : '#39424e';
  ctx.lineWidth = Math.max(4, 2*wallCm()*PX_PER_CM*view.z);
  ctx.lineJoin = 'miter';
  ctx.miterLimit = 8;
  if (locked) ctx.setLineDash([9,5]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // edge length labels
  ctx.font = '11px ui-monospace,Menlo,monospace';
  for (let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    const px = Math.hypot(sx(b.x)-sx(a.x), sy(b.y)-sy(a.y));
    if (px < 34) continue;
    const mx = (sx(a.x)+sx(b.x))/2, my = (sy(a.y)+sy(b.y))/2;
    let ang = Math.atan2(sy(b.y)-sy(a.y), sx(b.x)-sx(a.x));
    if (ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;
    // push label to the outside of the polygon
    const cx = pts.reduce((s,p)=>s+sx(p.x),0)/pts.length;
    const cy = pts.reduce((s,p)=>s+sy(p.y),0)/pts.length;
    let nx = -(sy(b.y)-sy(a.y)), ny = (sx(b.x)-sx(a.x));
    const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    if ((mx-cx)*nx + (my-cy)*ny < 0){ nx=-nx; ny=-ny; }
    const off = Math.max(3, wallCm()*PX_PER_CM*view.z) + 11;
    const pin = !!a.fix;
    const txt = (pin?'▮ ':'') + fmt(dist(a,b)) + ' cm';
    const isSel = state.sel && state.sel.kind==='edge' && state.sel.i===i;
    ctx.save();
    ctx.translate(mx+nx*off, my+ny*off);
    ctx.rotate(ang);
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = isSel ? '#2f6df6' : (pin ? '#fdf4e3' : 'rgba(255,255,255,.93)');
    ctx.fillRect(-tw/2-4,-8,tw+8,15);
    if (pin && !isSel){ ctx.strokeStyle='#e9cf9c'; ctx.lineWidth=1; ctx.strokeRect(-tw/2-4,-8,tw+8,15); }
    ctx.fillStyle = isSel ? '#fff' : (pin ? '#a9741f' : (locked?'#a9741f':'#5a6674'));
    ctx.textAlign='center';
    ctx.fillText(txt,0,3.5);
    ctx.restore();
  }

  // room name + area, placed where it won't sit on top of an object
  const bb = polyBounds(pts);
  const label = state.room.name || 'Room';
  const areaM2 = polyArea(pts)/10000;
  const c = labelSpot(pts);
  ctx.textAlign='center';
  ctx.fillStyle='#33404f';
  ctx.font='600 14px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(label, sx(c.x), sy(c.y)-4);
  ctx.fillStyle='#8b95a3';
  ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillText(areaM2.toFixed(2)+' m²', sx(c.x), sy(c.y)+13);
  ctx.textAlign='left';

  // corner handles
  const editable = !state.room.locked && !state.room.lockedSize;
  if (editable){
    pts.forEach((p,i) => {
      const isSel = state.sel && state.sel.kind==='vertex' && state.sel.i===i;
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), isSel?6:4.6, 0, Math.PI*2);
      ctx.fillStyle = isSel ? '#2f6df6' : '#fff';
      ctx.strokeStyle = '#2f6df6'; ctx.lineWidth=1.8;
      ctx.fill(); ctx.stroke();
    });
  }
}

/* Pick a spot for the room label: the centroid if it is clear of objects,
   otherwise the free interior point furthest from any object. */
function labelSpot(pts){
  const c = centroid(pts);
  const clearAt = (x,y) => !state.objects.some(o =>
    x > o.x-24 && x < o.x+o.w+24 && y > o.y-20 && y < o.y+o.h+20);
  if (pointInPoly(c, pts) && clearAt(c.x, c.y)) return c;

  const bb = polyBounds(pts);
  const steps = 24;
  let best = null, bestScore = -1;
  for (let i=1;i<steps;i++){
    for (let j=1;j<steps;j++){
      const x = bb.x + bb.w*i/steps, y = bb.y + bb.h*j/steps;
      if (!pointInPoly({x,y}, pts) || !clearAt(x,y)) continue;

      // the label box must sit fully inside the room, not across a wall
      const halfW = 70, halfH = 22;
      let insideOK = true;
      for (const c2 of [[-halfW,-halfH],[halfW,-halfH],[-halfW,halfH],[halfW,halfH]]){
        if (!pointInPoly({x:x+c2[0], y:y+c2[1]}, pts)){ insideOK = false; break; }
      }
      if (!insideOK) continue;

      // prefer points far from objects and near the vertical middle
      let d = 1e9;
      state.objects.forEach(o=>{
        const cx=Math.max(o.x,Math.min(x,o.x+o.w)), cy=Math.max(o.y,Math.min(y,o.y+o.h));
        d = Math.min(d, Math.hypot(x-cx, y-cy));
      });
      if (d===1e9) d = 500;
      const score = d - Math.abs(y-(bb.y+bb.h/2))*0.15;
      if (score > bestScore){ bestScore = score; best = {x,y}; }
    }
  }
  return best || c;
}

function centroid(pts){
  // area-weighted centroid, falls back to bbox centre for degenerate shapes
  let a=0, cx=0, cy=0;
  for (let i=0,n=pts.length;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n];
    const f = p.x*q.y - q.x*p.y;
    a += f; cx += (p.x+q.x)*f; cy += (p.y+q.y)*f;
  }
  if (Math.abs(a) < 1e-9){
    const b = polyBounds(pts);
    return {x:b.x+b.w/2, y:b.y+b.h/2};
  }
  a *= 0.5;
  return {x: cx/(6*a), y: cy/(6*a)};
}

/* ---------------- object geometry (rotation-aware) ----------------
   x/y/w/h describe the upright rectangle; rot spins it about its centre. */
const objRot = o => ((+o.rot || 0) * Math.PI) / 180;
const objCentre = o => ({x:o.x + o.w/2, y:o.y + o.h/2});

// upright object space -> world
function toWorld(o, p){
  const a = objRot(o); if (!a) return {x:p.x, y:p.y};
  const c = objCentre(o), cs = Math.cos(a), sn = Math.sin(a);
  const dx = p.x-c.x, dy = p.y-c.y;
  return {x: c.x + dx*cs - dy*sn, y: c.y + dx*sn + dy*cs};
}
// world -> upright object space
function toLocal(o, p){
  const a = -objRot(o); if (!a) return {x:p.x, y:p.y};
  const c = objCentre(o), cs = Math.cos(a), sn = Math.sin(a);
  const dx = p.x-c.x, dy = p.y-c.y;
  return {x: c.x + dx*cs - dy*sn, y: c.y + dx*sn + dy*cs};
}
function objCorners(o){
  return [{x:o.x,y:o.y},{x:o.x+o.w,y:o.y},{x:o.x+o.w,y:o.y+o.h},{x:o.x,y:o.y+o.h}]
    .map(p => toWorld(o,p));
}

function drawObject(o){
  const w=o.w*PX_PER_CM*view.z, h=o.h*PX_PER_CM*view.z;
  const c=objCentre(o);
  ctx.save();
  ctx.translate(sx(c.x), sy(c.y));
  ctx.rotate(objRot(o));
  const x=-w/2, y=-h/2;                 // draw upright around the rotated origin
  ctx.fillStyle = o.color || COLORS[0];
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = o.locked ? '#c8892a' : '#8a96a6';
  ctx.lineWidth = o.locked ? 1.8 : 1.2;
  if (o.locked) ctx.setLineDash([5,3]);
  ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.setLineDash([]);

  ctx.textAlign='center';
  const nm = o.name||'';
  if (h>30 && w>44){
    ctx.fillStyle='#2b3644';
    ctx.font='600 12.5px -apple-system,Segoe UI,Roboto,sans-serif';
    if (ctx.measureText(nm).width < w-10) ctx.fillText(nm, x+w/2, y+h/2 + (h>46?-2:4));
    if (h>46){
      ctx.fillStyle='#7b8794';
      ctx.font='10.5px ui-monospace,Menlo,monospace';
      ctx.fillText(fmt(o.w)+' × '+fmt(o.h)+' cm', x+w/2, y+h/2+13);
    }
  } else if (w>28 && h>13){
    ctx.fillStyle='#5a6674';
    ctx.font='600 10px -apple-system,Segoe UI,sans-serif';
    if (ctx.measureText(nm).width < w-6) ctx.fillText(nm, x+w/2, y+h/2+3.5);
  }
  ctx.textAlign='left';
  if (o.locked) lockBadge(x+w-10, y+10);
  ctx.restore();
}

function lockBadge(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#c8892a'; ctx.strokeStyle='#c8892a'; ctx.lineWidth=1.4;
  ctx.fillRect(-3.5,-1,7,6);
  ctx.beginPath(); ctx.arc(0,-1,2.6,Math.PI,0); ctx.stroke();
  ctx.restore();
}

function drawSelection(){
  const s = state.sel;
  if (!s) return;
  if (s.kind === 'object'){
    const o = objById(s.id); if (!o) return;
    const w=o.w*PX_PER_CM*view.z, h=o.h*PX_PER_CM*view.z, c=objCentre(o);
    ctx.save();
    ctx.strokeStyle = o.locked?'#c8892a':'#2f6df6';
    ctx.lineWidth=1.4; ctx.setLineDash([4,3]);
    ctx.save();
    ctx.translate(sx(c.x), sy(c.y));
    ctx.rotate(objRot(o));
    ctx.strokeRect(-w/2-2.5, -h/2-2.5, w+5, h+5);
    ctx.restore();
    ctx.setLineDash([]);
    if (!o.locked && !o.lockedSize){
      objHandles(o).forEach(h => {
        ctx.beginPath();
        ctx.arc(sx(h.x), sy(h.y), 4.5, 0, Math.PI*2);
        ctx.fillStyle='#fff'; ctx.strokeStyle='#2f6df6'; ctx.lineWidth=1.6;
        ctx.fill(); ctx.stroke();
      });
    }
    ctx.restore();
  } else if (s.kind === 'edge' && hasRoom()){
    const pts = state.room.pts;
    const a = pts[s.i], b = pts[(s.i+1)%pts.length];
    ctx.save();
    ctx.strokeStyle='#2f6df6';
    ctx.lineWidth=Math.max(4,13*view.z);
    ctx.lineCap='round';
    ctx.globalAlpha=.35;
    ctx.beginPath(); ctx.moveTo(sx(a.x),sy(a.y)); ctx.lineTo(sx(b.x),sy(b.y)); ctx.stroke();
    ctx.restore();
  }
}

function objHandles(o){
  const {x,y,w,h}=o;
  return [{k:'nw',x,y},{k:'n',x:x+w/2,y},{k:'ne',x:x+w,y},
          {k:'w',x,y:y+h/2},{k:'e',x:x+w,y:y+h/2},
          {k:'sw',x,y:y+h},{k:'s',x:x+w/2,y:y+h},{k:'se',x:x+w,y:y+h}]
    .map(p => { const q = toWorld(o,p); return {k:p.k, x:q.x, y:q.y}; });
}

function drawOutlinePreview(){
  const pts = drawPts;
  if (!pts.length) return;
  ctx.save();
  ctx.strokeStyle='#2f6df6'; ctx.lineWidth=Math.max(2,7*view.z); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(sx(p.x),sy(p.y)):ctx.moveTo(sx(p.x),sy(p.y)));
  if (hoverPt) ctx.lineTo(sx(hoverPt.x), sy(hoverPt.y));
  ctx.globalAlpha=.85; ctx.stroke(); ctx.globalAlpha=1;

  // closing hint back to the first point
  if (pts.length >= 2 && hoverPt){
    ctx.setLineDash([5,5]); ctx.lineWidth=1.5; ctx.globalAlpha=.5;
    ctx.beginPath();
    ctx.moveTo(sx(hoverPt.x),sy(hoverPt.y));
    ctx.lineTo(sx(pts[0].x),sy(pts[0].y));
    ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  pts.forEach((p,i)=>{
    ctx.beginPath();
    ctx.arc(sx(p.x),sy(p.y), i===0?6:4.2,0,Math.PI*2);
    ctx.fillStyle = i===0 ? '#2f6df6' : '#fff';
    ctx.strokeStyle='#2f6df6'; ctx.lineWidth=1.8;
    ctx.fill(); ctx.stroke();
  });
  // live segment length
  if (hoverPt && pts.length){
    const last = pts[pts.length-1];
    const d = dist(last, hoverPt);
    if (d > 1) badge(sx(hoverPt.x)+12, sy(hoverPt.y)-12, fmt(d)+' cm');
  }
  ctx.restore();
}

function badge(x,y,text){
  ctx.font='11px ui-monospace,Menlo,monospace';
  const w = ctx.measureText(text).width+12;
  ctx.fillStyle='rgba(27,36,48,.88)';
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y-9,w,19,5); ctx.fill(); }
  else ctx.fillRect(x,y-9,w,19);
  ctx.fillStyle='#fff';
  ctx.fillText(text,x+6,y+4);
}

/* ======================================================================
   HIT TESTING
   ====================================================================== */
function hitVertex(px,py){
  if (!hasRoom() || state.room.locked || state.room.lockedSize) return -1;
  const pts = state.room.pts;
  for (let i=0;i<pts.length;i++)
    if (Math.hypot(sx(pts[i].x)-px, sy(pts[i].y)-py) <= 8) return i;
  return -1;
}
function hitEdge(px,py){
  if (!hasRoom()) return -1;
  const pts = state.room.pts;
  const p = {x:wx(px), y:wy(py)};
  // the wall is drawn outwards from the outline, so reach across its thickness
  const tol = Math.max(8/(PX_PER_CM*view.z), 7, wallCm());
  for (let i=0;i<pts.length;i++)
    if (distToSeg(p, pts[i], pts[(i+1)%pts.length]) <= tol) return i;
  return -1;
}
function hitObject(px,py){
  const p = {x:wx(px), y:wy(py)};
  for (let i=state.objects.length-1;i>=0;i--){
    const o = state.objects[i], q = toLocal(o, p);
    if (q.x>=o.x && q.x<=o.x+o.w && q.y>=o.y && q.y<=o.y+o.h) return o;
  }
  return null;
}
/* Which resize cursor a handle should show, once the object's rotation is
   taken into account. Screen angles run clockwise from east. */
const HANDLE_ANGLE = {e:0, se:45, s:90, sw:135, w:180, nw:225, n:270, ne:315};
function resizeCursor(k, o){
  const a = HANDLE_ANGLE[k] + (o ? (+o.rot||0) : 0);
  return ['ew','nwse','ns','nesw'][((Math.round(a/45) % 4) + 4) % 4] + '-resize';
}
function hitObjHandle(px,py){
  const s = state.sel;
  if (!s || s.kind!=='object') return null;
  const o = objById(s.id);
  if (!o || o.locked || o.lockedSize) return null;
  for (const h of objHandles(o))
    if (Math.hypot(sx(h.x)-px, sy(h.y)-py) <= 7.5) return h.k;
  return null;
}

/* ======================================================================
   POINTER
   ====================================================================== */
let drag = null;
let spaceDown = false;
let shiftDown = false;
const pos = e => { const r = cv.getBoundingClientRect(); return {px:e.clientX-r.left, py:e.clientY-r.top}; };

/* Next traced corner: square to the previous one, grid-snapping only the axis
   that is actually free (so the shared coordinate stays exact). */
function tracePoint(prev, px, py, shift){
  const sn = axisSnap(prev, wx(px), wy(py));
  return Math.abs(sn.y-prev.y) < EPS
    ? {x: shift?sn.x:snapV(sn.x), y: prev.y}
    : {x: prev.x, y: shift?sn.y:snapV(sn.y)};
}


cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur();
  const {px,py} = pos(e);

  if (e.button===1 || e.button===2 || spaceDown){
    drag = {mode:'pan', px, py, vx:view.x, vy:view.y};
    cv.style.cursor='grabbing';
    return;
  }
  if (e.button!==0) return;

  /* --- room tracing --- */
  if (tool === 'room'){
    let p = {x:snapV(wx(px)), y:snapV(wy(py))};
    if (drawPts && drawPts.length){
      p = tracePoint(drawPts[drawPts.length-1], px, py, e.shiftKey);
      // click the first point again to close the room
      if (drawPts.length>=3 && Math.hypot(sx(drawPts[0].x)-px, sy(drawPts[0].y)-py) <= 11){
        finishRoom();
        return;
      }
    }
    if (!drawPts) drawPts = [];
    drawPts.push({x:clean(p.x), y:clean(p.y)});
    hoverPt = {x:p.x, y:p.y};
    showHint(drawPts.length<3
      ? 'Click each corner of the room. '+drawPts.length+' placed.'
      : 'Click the first corner (or double-click) to close the room.', 0);
    draw();
    return;
  }

  /* --- object placement --- */
  if (tool === 'object'){
    const a = {x:snapV(wx(px)), y:snapV(wy(py))};
    drag = {mode:'newobj', ax:a.x, ay:a.y, cur:{x:a.x,y:a.y}};
    return;
  }

  /* --- select / move --- */
  const hk = hitObjHandle(px,py);
  if (hk){
    const o = objById(state.sel.id);
    drag = {mode:'objresize', key:hk, o, start:Object.assign({},o)};
    return;
  }
  const vi = hitVertex(px,py);
  if (vi >= 0){
    select({kind:'vertex', i:vi});
    drag = {mode:'vertex', i:vi, start:Object.assign({}, state.room.pts[vi])};
    draw();
    return;
  }
  const ob = hitObject(px,py);
  if (ob){
    select({kind:'object', id:ob.id});
    if (ob.locked){ showHint('"'+(ob.name||'Object')+'" is locked — unlock it to move or resize.'); draw(); return; }
    drag = {mode:'objmove', o:ob, start:Object.assign({},ob), mx:wx(px), my:wy(py)};
    draw();
    return;
  }
  const ei = hitEdge(px,py);
  if (ei >= 0){
    select({kind:'edge', i:ei});
    if (!state.room.locked){
      drag = {mode:'room', start:state.room.pts.map(p=>({x:p.x,y:p.y})), mx:wx(px), my:wy(py), moved:false};
    }
    draw();
    return;
  }
  if (hasRoom() && pointInPoly({x:wx(px),y:wy(py)}, state.room.pts)){
    select({kind:'room'});
    if (!state.room.locked)
      drag = {mode:'room', start:state.room.pts.map(p=>({x:p.x,y:p.y})), mx:wx(px), my:wy(py), moved:false};
    draw();
    return;
  }
  select(null);
  draw();
});

cv.addEventListener('pointermove', e => {
  const {px,py} = pos(e);

  if (tool === 'room' && drawPts && drawPts.length){
    hoverPt = tracePoint(drawPts[drawPts.length-1], px, py, e.shiftKey);
    draw();
    return;
  }

  if (!drag){
    if (tool !== 'select'){ cv.style.cursor='crosshair'; return; }
    const hk = hitObjHandle(px,py);
    if (hk){
      cv.style.cursor = resizeCursor(hk, objById(state.sel.id));
    }
    else if (hitVertex(px,py)>=0) cv.style.cursor='move';
    else {
      const o = hitObject(px,py);
      if (o) cv.style.cursor = o.locked?'not-allowed':'move';
      else if (hitEdge(px,py)>=0) cv.style.cursor = state.room.locked?'not-allowed':'move';
      else cv.style.cursor='default';
    }
    return;
  }

  if (drag.mode==='pan'){
    view.x = drag.vx - (px-drag.px)/(PX_PER_CM*view.z);
    view.y = drag.vy - (py-drag.py)/(PX_PER_CM*view.z);
    draw(); return;
  }

  if (drag.mode==='newobj'){
    let x=wx(px), y=wy(py);
    if (!e.shiftKey){ x=snapV(x); y=snapV(y); }
    drag.cur={x,y};
    draw();
    // live preview
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
    const r = norm(drag.ax,drag.ay,x,y);
    ctx.fillStyle='rgba(47,109,246,.12)'; ctx.strokeStyle='#2f6df6'; ctx.lineWidth=1.4;
    ctx.setLineDash([4,3]);
    ctx.fillRect(sx(r.x),sy(r.y),r.w*PX_PER_CM*view.z,r.h*PX_PER_CM*view.z);
    ctx.strokeRect(sx(r.x)+.5,sy(r.y)+.5,r.w*PX_PER_CM*view.z-1,r.h*PX_PER_CM*view.z-1);
    ctx.setLineDash([]);
    badge(sx(r.x)+r.w*PX_PER_CM*view.z+12, sy(r.y)+r.h*PX_PER_CM*view.z+6, fmt(r.w)+' × '+fmt(r.h)+' cm');
    ctx.restore();
    return;
  }

  if (drag.mode==='vertex'){
    let x=wx(px), y=wy(py);
    if (!e.shiftKey){ x=snapV(x); y=snapV(y); }
    moveCorner(state.room.pts, drag.i, x, y);   // neighbours follow, walls stay square
    syncPanel(); updStats(); draw();
    return;
  }

  if (drag.mode==='room'){
    let dx = wx(px)-drag.mx, dy = wy(py)-drag.my;
    if (!e.shiftKey){
      const t = drag.start[0];
      dx = snapV(t.x+dx)-t.x;
      dy = snapV(t.y+dy)-t.y;
    }
    if (Math.abs(dx)>0.01||Math.abs(dy)>0.01) drag.moved = true;
    state.room.pts = drag.start.map(p=>({x:clean(p.x+dx), y:clean(p.y+dy)}));
    syncPanel(); updStats(); draw();
    return;
  }

  if (drag.mode==='objmove'){
    const o=drag.o, st=drag.start;
    let nx=st.x+(wx(px)-drag.mx), ny=st.y+(wy(py)-drag.my);
    if (!e.shiftKey){ nx=snapV(nx); ny=snapV(ny); }
    o.x=clean(nx); o.y=clean(ny);
    syncPanel(); draw();
    return;
  }

  if (drag.mode==='objresize'){
    const o=drag.o, st=drag.start, k=drag.key;
    // resize along the object's own axes, so a rotated object grows the way it looks
    const m = toLocal(st, {x:wx(px), y:wy(py)});
    let mx=m.x, my=m.y;
    if (!e.shiftKey){ mx=snapV(mx); my=snapV(my); }
    let x1=st.x, y1=st.y, x2=st.x+st.w, y2=st.y+st.h;
    if (k.includes('w')) x1=mx;
    if (k.includes('e')) x2=mx;
    if (k.includes('n')) y1=my;
    if (k.includes('s')) y2=my;
    const r = norm(x1,y1,x2,y2);
    const w=Math.max(1,r.w), h=Math.max(1,r.h);
    // the local rect moved, so re-derive the world centre to keep the fixed edge put
    const c = toWorld(st, {x:r.x+r.w/2, y:r.y+r.h/2});
    o.w=clean(w); o.h=clean(h);
    o.x=clean(c.x-w/2); o.y=clean(c.y-h/2);
    syncPanel(); draw();
  }
});

cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag=null;
  cv.style.cursor='default';
  if (d.mode==='newobj'){
    const r = norm(d.ax,d.ay,d.cur.x,d.cur.y);
    if (r.w>=2 && r.h>=2){
      const o = {id:uid(), name:'Object '+(state.objects.length+1),
                 x:clean(r.x), y:clean(r.y), w:clean(r.w), h:clean(r.h),
                 rot:0, color:COLORS[state.objects.length%COLORS.length], locked:false, lockedSize:false};
      state.objects.push(o);
      select({kind:'object', id:o.id});
      setTool('select');
    } else {
      showHint('Drag to give the object a size.');
    }
  }
  refreshList(); syncPanel(); updStats(); draw();
});
cv.addEventListener('pointercancel', ()=>{ drag=null; draw(); });
cv.addEventListener('contextmenu', e=>e.preventDefault());

// double-click renames an object, closes the outline, or adds/removes a corner
cv.addEventListener('dblclick', e => {
  const {px,py} = pos(e);
  if (tool==='room' && drawPts && drawPts.length>=3){ finishRoom(); return; }
  if (tool!=='select') return;

  // corners and walls keep their own double-click actions, so they win the hit test
  const shapeable = hasRoom() && !state.room.locked && !state.room.lockedSize;
  const vi = hitVertex(px,py);
  if (vi>=0){
    if (!shapeable) return;
    if (state.room.pts.length<=4){ showHint('A squared room needs at least 4 corners.'); return; }
    removeCorner(vi);
    select(null); updStats(); syncPanel(); draw();
    return;
  }
  const ob = hitObject(px,py);
  if (ob){
    select({kind:'object', id:ob.id});
    draw();
    startRename(ob);
    return;
  }
  if (!shapeable) return;
  const ei = hitEdge(px,py);
  if (ei>=0){
    // a lone corner would just split the wall in two straight halves, so add a jog
    if (!addJog(state.room.pts, ei)){ showHint('This wall is too short to add a jog.'); return; }
    select({kind:'vertex', i:(ei+2)%state.room.pts.length});
    updStats(); syncPanel(); draw();
    showHint('Jog added — drag its corners to shape the room.');
  }
});

/* ======================================================================
   UNDO / REDO

   Snapshots of the model (room + objects) rather than inverse operations —
   with this many mutation sites, a diffed snapshot cannot drift out of sync
   the way hand-written undo steps would.

   commit() is cheap and idempotent: it serialises, compares with the top of
   the stack, and pushes only on a real change. So it can be fired liberally
   from the end of any interaction, and a whole drag collapses into one step.
   ====================================================================== */
const HISTORY_MAX = 100;
const hist = {stack:[], i:-1};

// The grid size and the viewport are display settings, so they stay out of it.
function modelJSON(){
  return JSON.stringify({
    room:{name:state.room.name, pts:state.room.pts, wall:state.room.wall,
          locked:state.room.locked, lockedSize:state.room.lockedSize},
    objects:state.objects
  });
}

function commit(){
  const m = modelJSON();
  if (hist.i>=0 && hist.stack[hist.i].m === m) return false;   // nothing changed
  hist.stack.length = hist.i+1;                                   // drop any redo branch
  hist.stack.push({m, sel:state.sel ? JSON.parse(JSON.stringify(state.sel)) : null});
  if (hist.stack.length > HISTORY_MAX) hist.stack.shift();
  hist.i = hist.stack.length-1;
  updHistoryUI();
  return true;
}

/* A selection captured before an edit may not exist any more. */
function validSel(sel){
  if (!sel) return null;
  if (sel.kind==='object') return state.objects.some(o=>o.id===sel.id) ? sel : null;
  if (sel.kind==='vertex' || sel.kind==='edge') return sel.i < state.room.pts.length ? sel : null;
  return sel;
}

function restore(entry){
  const d = JSON.parse(entry.m);
  state.room = {name:d.room.name,
                pts:d.room.pts.map(p=>({x:p.x, y:p.y, fix:!!p.fix})),
                wall:d.room.wall, locked:d.room.locked, lockedSize:d.room.lockedSize};
  state.objects = d.objects.map(o=>Object.assign({}, o));
  state.sel = validSel(entry.sel);
  if (renaming) endRename();
  drag = null;
  refreshList(); updStats(); syncPanel(); draw(); updHistoryUI();
}

function undo(){
  if (hist.i<=0){ showHint('Nothing left to undo.'); return; }
  hist.i--; restore(hist.stack[hist.i]); showHint('Undo');
}
function redo(){
  if (hist.i>=hist.stack.length-1){ showHint('Nothing to redo.'); return; }
  hist.i++; restore(hist.stack[hist.i]); showHint('Redo');
}
function updHistoryUI(){
  document.getElementById('btnUndo').disabled = hist.i<=0;
  document.getElementById('btnRedo').disabled = hist.i>=hist.stack.length-1;
}
document.getElementById('btnUndo').addEventListener('click',undo);
document.getElementById('btnRedo').addEventListener('click',redo);

/* Catch-all: these all bubble to window *after* the app's own handlers have
   run, so the model is already in its post-edit state. Keystrokes are handled
   at their specific sites instead, so typing a name is one step, not one per
   letter. */
['pointerup','click','change'].forEach(t=>window.addEventListener(t,()=>commit()));

/* ---------------- inline rename ---------------- */
const renameBox = document.getElementById('renameBox');
let renaming = null;              // {id, prev} while the editor is open

function startRename(o){
  renaming = {id:o.id, prev:o.name||''};
  const ow = o.w*PX_PER_CM*view.z, oh = o.h*PX_PER_CM*view.z;
  const bw = Math.max(104, Math.min(ow, 240));
  const SW = cv.width/dpr, SH = cv.height/dpr;
  const clamp = (v,max) => Math.round(Math.max(4, Math.min(v, max-4)));
  renameBox.style.width = bw+'px';
  renameBox.style.left = clamp(sx(o.x)+ow/2 - bw/2, SW-bw)+'px';
  renameBox.style.top  = clamp(sy(o.y)+oh/2 - 14, SH-28)+'px';
  renameBox.style.display = 'block';
  renameBox.value = renaming.prev;
  renameBox.focus(); renameBox.select();
  showHint('Type a new name — Enter to keep it, Esc to cancel.');
}

function endRename(){
  if (!renaming) return null;
  const o = objById(renaming.id), prev = renaming.prev;
  renaming = null;                // cleared first, so the blur below is a no-op
  renameBox.style.display = 'none';
  renameBox.blur();
  refreshList(); syncPanel(); draw();
  return {o, prev};
}

function applyRename(){
  const r = endRename();
  if (r && r.o){
    r.o.name = renameBox.value.trim() || r.prev || 'Object';
    refreshList(); syncPanel(); draw();
  }
  commit();                       // one undo step per rename, not per keystroke
}

function cancelRename(){
  const r = endRename();
  if (r && r.o){ r.o.name = r.prev; refreshList(); syncPanel(); draw(); }
  commit();
}

// keep the canvas in sync as you type
renameBox.addEventListener('input', ()=>{
  const o = renaming && objById(renaming.id);
  if (o){ o.name = renameBox.value; refreshList(); draw(); }
});
renameBox.addEventListener('keydown', e => {
  if (e.key==='Enter'){ e.preventDefault(); applyRename(); }
  else if (e.key==='Escape'){ e.preventDefault(); cancelRename(); }
});
renameBox.addEventListener('blur', applyRename);

function norm(x1,y1,x2,y2){
  return {x:Math.min(x1,x2), y:Math.min(y1,y2), w:Math.abs(x2-x1), h:Math.abs(y2-y1)};
}

function finishRoom(){
  if (!drawPts || drawPts.length<3){ showHint('A room needs at least 3 corners.'); return; }
  const sq = rectify(drawPts);
  if (sq.length<4){ showHint('That outline is too thin — a squared room needs at least 4 corners.'); return; }
  state.room.pts = sq;
  drawPts=null; hoverPt=null;
  setTool('select');
  select({kind:'room'});
  hideHint();
  updStats(); refreshList(); syncPanel(); fit(); commit();
  showHint('Room created — walls are kept square. Drag corners to reshape, or double-click a wall to add a jog.', 3600);
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (renaming) applyRename();     // the editor is anchored to screen coords, so don't let it drift
  const {px,py}=pos(e);
  const b={x:wx(px), y:wy(py)};
  view.z = Math.min(8, Math.max(0.03, view.z*Math.pow(0.999, e.deltaY*(e.ctrlKey?4:1.6))));
  view.x = b.x - px/(PX_PER_CM*view.z);
  view.y = b.y - py/(PX_PER_CM*view.z);
  updZoom(); draw();
}, {passive:false});

/* ======================================================================
   SELECTION + PANEL
   ====================================================================== */
function select(s){ state.sel = s; refreshList(); syncPanel(); }

const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const lockIcon = '<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const sizeIcon = '<svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>';

function syncPanel(){
  const s = state.sel;

  if (!hasRoom() && !drawPts){
    propBody.innerHTML = '<div class="empty">No room yet.<br>Click <b>Draw room</b>, then click each<br>corner. Click the first corner again<br>to close the shape.</div>';
    return;
  }
  if (!s){
    propBody.innerHTML = '<div class="empty">Nothing selected.<br>Click the room, a wall,<br>a corner, or an object.</div>';
    return;
  }

  if (s.kind === 'object'){
    const o = objById(s.id);
    if (!o){ propBody.innerHTML='<div class="empty">Nothing selected.</div>'; return; }
    const pd = o.locked?'disabled':'';
    const sd = (o.locked||o.lockedSize)?'disabled':'';
    propBody.innerHTML =
      `<div class="row"><label>Name</label><input type="text" id="pName" value="${esc(o.name||'')}"></div>
       <div style="height:11px"></div>
       <div class="pair">
         <div class="row"><label>X</label><input type="number" step="1" id="pX" value="${fmt(o.x)}" ${pd}><span class="unit">cm</span></div>
         <div class="row"><label>Y</label><input type="number" step="1" id="pY" value="${fmt(o.y)}" ${pd}><span class="unit">cm</span></div>
       </div>
       <div style="height:9px"></div>
       <div class="pair">
         <div class="row"><label>W</label><input type="number" step="1" min="1" id="pW" value="${fmt(o.w)}" ${sd}><span class="unit">cm</span></div>
         <div class="row"><label>H</label><input type="number" step="1" min="1" id="pH" value="${fmt(o.h)}" ${sd}><span class="unit">cm</span></div>
       </div>
       <div style="height:11px"></div>
       <div class="row"><label>Rotate</label>
         <input type="number" step="1" id="pRot" value="${normRot(o.rot)}" ${pd}><span class="unit">°</span></div>
       <div class="row"><label></label>
         <input type="range" min="0" max="359" step="1" id="pRotR" value="${normRot(o.rot)}" ${pd}
                title="Drag to rotate — hold Shift for 15° steps"></div>
       <div class="row"><label></label><div class="rotsteps" id="rotSteps">
         ${[-90,-45,45,90].map(d=>`<button class="btn rotstep" data-d="${d}" ${pd}>${d>0?'+':'−'}${Math.abs(d)}°</button>`).join('')}
         <button class="btn rotstep" data-r="0" ${pd} title="Back to upright">0°</button>
       </div></div>
       <div style="height:11px"></div>
       <div class="row"><label>Colour</label><div class="swatches" id="sw">
         ${COLORS.map(c=>`<div class="sw ${c===o.color?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}
       </div></div>
       <div style="height:13px"></div>
       <div class="toggle ${o.locked?'on':''}" id="tgLock"><span>${lockIcon} Lock position &amp; size</span>
         <input type="checkbox" ${o.locked?'checked':''} tabindex="-1" style="pointer-events:none"></div>
       <div class="toggle ${(!o.locked&&o.lockedSize)?'on':''}" id="tgSize" ${o.locked?'style="opacity:.5"':''}>
         <span>${sizeIcon} Lock size only</span>
         <input type="checkbox" ${(o.locked||o.lockedSize)?'checked':''} tabindex="-1" style="pointer-events:none"></div>
       <button class="btn danger fullbtn" id="btnDel">
         <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete object</button>`;
    wireObject(o);
    return;
  }

  if (s.kind === 'vertex'){
    const p = state.room.pts[s.i];
    if (!p){ select(null); return; }
    const d = state.room.locked?'disabled':'';
    propBody.innerHTML =
      `<div class="row"><label>Corner</label><b style="font-variant-numeric:tabular-nums">#${s.i+1} of ${state.room.pts.length}</b></div>
       <div style="height:11px"></div>
       <div class="pair">
         <div class="row"><label>X</label><input type="number" step="1" id="vX" value="${fmt(p.x)}" ${d}><span class="unit">cm</span></div>
         <div class="row"><label>Y</label><input type="number" step="1" id="vY" value="${fmt(p.y)}" ${d}><span class="unit">cm</span></div>
       </div>
       <div style="height:12px"></div>
       <button class="btn fullbtn" id="btnSelRoom">Select whole room</button>
       <button class="btn danger fullbtn" id="btnDelV" ${state.room.pts.length<=3?'disabled':''}>
         <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove corner</button>
       <div class="note">Double-click a wall to add a jog; double-click a corner to remove it. Walls stay square.</div>`;
    const $=id=>document.getElementById(id);
    const upd=()=>{
      const x=parseFloat($('vX').value), y=parseFloat($('vY').value);
      const p=state.room.pts[s.i];
      moveCorner(state.room.pts, s.i, isNaN(x)?p.x:x, isNaN(y)?p.y:y);
      updStats(); draw();
    };
    ['vX','vY'].forEach(id=>{ const el=$(id); if(el){el.addEventListener('input',upd);el.addEventListener('change',upd);} });
    $('btnSelRoom').addEventListener('click',()=>{select({kind:'room'});draw();});
    const bd=$('btnDelV');
    if(bd) bd.addEventListener('click',()=>{
      if(state.room.pts.length<=4){showHint('A squared room needs at least 4 corners.');return;}
      removeCorner(s.i); select(null); updStats(); syncPanel(); draw();
    });
    return;
  }

  if (s.kind === 'edge'){
    const pts=state.room.pts;
    const len=wallLen(pts,s.i);
    const axis=wallAxis(pts,s.i);
    const roomLocked = state.room.locked||state.room.lockedSize;
    const pinned = isPinned(pts,s.i);
    const d = roomLocked?'disabled':'';
    const ld = (roomLocked||pinned)?'disabled':'';
    const j = absorberFor(pts,s.i);
    const blockers = blockingWalls(pts,s.i);
    const note = pinned
      ? 'This wall\'s length is fixed. Unpin it to change it.'
      : j>=0
        ? `Changing this length will resize wall #${j+1} to keep the room closed.`
        : `No wall can absorb a change — wall${blockers.length>1?'s':''} #${blockers.join(', #')} ${blockers.length>1?'are':'is'} pinned.`;
    propBody.innerHTML =
      `<div class="row"><label>Wall</label><b>#${s.i+1} of ${pts.length}</b>
         <span class="unit" style="margin-left:auto">${axis==='h'?'Horizontal':'Vertical'}</span></div>
       <div style="height:11px"></div>
       <div class="row"><label>Length</label><input type="number" step="1" min="1" id="eLen" value="${fmt(len)}" ${ld}><span class="unit">cm</span></div>
       <div class="toggle ${pinned?'on':''}" id="tgPin" ${roomLocked?'style="opacity:.5"':''}>
         <span>${lockIcon} Fix this length</span>
         <input type="checkbox" ${pinned?'checked':''} tabindex="-1" style="pointer-events:none"></div>
       <div class="note ${j<0&&!pinned?'warn':''}" id="eNote">${note}</div>
       <div style="height:12px"></div>
       <button class="btn fullbtn" id="btnAddV" ${d}>Add a jog to this wall</button>
       <button class="btn fullbtn" id="btnSelRoom2">Select whole room</button>`;
    const $=id=>document.getElementById(id);
    const el=$('eLen');
    const upd=()=>{
      const L=Math.max(1,parseFloat(el.value)||1);
      const r=setWallLength(pts, s.i, L);
      if(!r.ok){
        el.value=fmt(wallLen(pts,s.i));
        showHint(r.reason==='pinned'
          ? 'This wall\'s length is fixed — unpin it first.'
          : `Wall #${s.i+1} can't change: wall${blockers.length>1?'s':''} #${blockers.join(', #')} ${blockers.length>1?'are':'is'} pinned. Unpin one to make room.`);
        return;
      }
      updStats(); draw(); commit();
    };
    if(el){ el.addEventListener('change',upd);
            el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') upd(); }); }
    $('tgPin').addEventListener('click',()=>{
      if(roomLocked){showHint('The room is locked — unlock it first.');return;}
      pts[s.i].fix=!pts[s.i].fix; syncPanel(); draw();
    });
    const ab=$('btnAddV');
    if(ab) ab.addEventListener('click',()=>{
      if(!addJog(pts,s.i)){showHint('This wall is too short to add a jog.');return;}
      select({kind:'vertex',i:(s.i+2)%pts.length}); updStats(); draw();
      showHint('Jog added — drag its corners to shape it.');
    });
    $('btnSelRoom2').addEventListener('click',()=>{select({kind:'room'});draw();});
    return;
  }

  // whole room
  const r = state.room;
  const bb = polyBounds(r.pts);
  propBody.innerHTML =
    `<div class="row"><label>Name</label><input type="text" id="rName" value="${esc(r.name||'Room')}"></div>
     <div style="height:11px"></div>
     <div class="pair">
       <div class="row"><label>X</label><input type="number" step="1" id="rX" value="${fmt(bb.x)}" ${r.locked?'disabled':''}><span class="unit">cm</span></div>
       <div class="row"><label>Y</label><input type="number" step="1" id="rY" value="${fmt(bb.y)}" ${r.locked?'disabled':''}><span class="unit">cm</span></div>
     </div>
     <div style="height:11px"></div>
     <div class="row"><label>Wall</label>
       <input type="number" step="1" min="0" max="100" id="rWall" value="${fmt(wallCm())}" ${r.locked?'disabled':''}><span class="unit">cm</span></div>
     <div class="note">Wall thickness is drawn outwards, so every length and the
       floor area shown are internal &mdash; measured inside face to inside face.</div>
     <div style="height:12px"></div>
     <div class="toggle ${r.locked?'on':''}" id="tgRLock"><span>${lockIcon} Lock position &amp; shape</span>
       <input type="checkbox" ${r.locked?'checked':''} tabindex="-1" style="pointer-events:none"></div>
     <div class="toggle ${(!r.locked&&r.lockedSize)?'on':''}" id="tgRSize" ${r.locked?'style="opacity:.5"':''}>
       <span>${sizeIcon} Lock shape only</span>
       <input type="checkbox" ${(r.locked||r.lockedSize)?'checked':''} tabindex="-1" style="pointer-events:none"></div>
     <div class="note">Click a wall or corner to edit it individually.</div>`;
  const $=id=>document.getElementById(id);
  $('rName').addEventListener('input',e=>{ r.name=e.target.value; updStats(); draw(); });
  const move=()=>{
    const nx=parseFloat($('rX').value), ny=parseFloat($('rY').value);
    const b2=polyBounds(r.pts);
    const dx=(isNaN(nx)?b2.x:nx)-b2.x, dy=(isNaN(ny)?b2.y:ny)-b2.y;
    r.pts=r.pts.map(p=>({x:clean(p.x+dx), y:clean(p.y+dy), fix:p.fix}));
    updStats(); draw();
  };
  ['rX','rY'].forEach(id=>{const el=$(id); if(el) el.addEventListener('change',move);});
  const wEl=$('rWall');
  if(wEl){
    const setW=()=>{ const v=parseFloat(wEl.value);
      if(!isNaN(v)){ r.wall=Math.max(0,Math.min(100,v)); updStats(); draw(); } };
    wEl.addEventListener('input',setW); wEl.addEventListener('change',setW);
  }
  $('tgRLock').addEventListener('click',()=>{ r.locked=!r.locked; syncPanel(); draw(); });
  $('tgRSize').addEventListener('click',()=>{
    if (r.locked){ showHint('Position lock already includes the shape — turn it off first.'); return; }
    r.lockedSize=!r.lockedSize; syncPanel(); draw();
  });
}

function wireObject(o){
  const $=id=>document.getElementById(id);
  const num=(el,f)=>{ if(!el)return;
    const ap=()=>{const v=parseFloat(el.value); if(!isNaN(v)){f(v);draw();refreshList();}};
    el.addEventListener('input',ap); el.addEventListener('change',ap); };
  $('pName').addEventListener('input',e=>{o.name=e.target.value;refreshList();draw();});
  num($('pX'),v=>o.x=clean(v));
  num($('pY'),v=>o.y=clean(v));
  num($('pW'),v=>o.w=clean(Math.max(1,v)));
  num($('pH'),v=>o.h=clean(Math.max(1,v)));
  /* rotation: the slider and the number box drive the same value, and each
     mirrors the other without a full panel rebuild (that would kill the drag) */
  const rotN=$('pRot'), rotR=$('pRotR');
  const setRot=(v,from)=>{
    o.rot=normRot(v);
    if(from!==rotN) rotN.value=o.rot;
    if(from!==rotR) rotR.value=o.rot;
    draw();
  };
  // Shift gives coarse 15° steps while dragging the slider
  if(rotR) rotR.addEventListener('input',e=>{
    const v=+e.target.value;
    setRot(shiftDown ? Math.round(v/15)*15 : v, shiftDown ? null : rotR);
  });
  if(rotN){
    const ap=()=>{const v=parseFloat(rotN.value); if(!isNaN(v)) setRot(v,rotN);};
    rotN.addEventListener('input',ap);
    rotN.addEventListener('change',()=>{rotN.value=normRot(rotN.value); setRot(rotN.value,rotN);});
  }
  const steps=$('rotSteps');
  if(steps) steps.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||b.disabled)return;
    setRot(b.dataset.r!==undefined ? +b.dataset.r : o.rot+(+b.dataset.d), null);
  });

  const sw=$('sw');
  if(sw) sw.addEventListener('click',e=>{
    const t=e.target.closest('.sw'); if(!t)return;
    o.color=t.dataset.c;
    sw.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel',x===t));
    draw(); refreshList();
  });
  $('tgLock').addEventListener('click',()=>{o.locked=!o.locked;syncPanel();refreshList();draw();});
  $('tgSize').addEventListener('click',()=>{
    if(o.locked){showHint('Position lock already includes size — turn it off first.');return;}
    o.lockedSize=!o.lockedSize;syncPanel();refreshList();draw();
  });
  $('btnDel').addEventListener('click',()=>delObject(o.id));
}

function delObject(id){
  const o=objById(id); if(!o)return;
  if(o.locked){showHint('Object is locked — unlock it before deleting.');return;}
  state.objects=state.objects.filter(x=>x.id!==id);
  if(state.sel&&state.sel.kind==='object'&&state.sel.id===id) state.sel=null;
  refreshList(); syncPanel(); draw(); commit();
}

function updStats(){
  if (!hasRoom()){ roomStats.innerHTML='<div class="empty" style="padding:8px 0">No room defined yet.</div>'; return; }
  const pts=state.room.pts;
  const bb=polyBounds(pts), ob=outerBounds(pts);
  roomStats.innerHTML =
    `<div class="stat"><span>Name</span><b>${esc(state.room.name||'Room')}</b></div>
     <div class="stat"><span>Corners</span><b>${pts.length}</b></div>
     <div class="stat"><span>Walls</span><b>${pts.length}</b></div>
     <div class="stat"><span>Wall</span><b>${fmt(wallCm())} cm</b></div>
     <div class="stat"><span>Internal perimeter</span><b>${fmt(polyPerimeter(pts))} cm</b></div>
     <div class="stat"><span>Floor area</span><b>${(polyArea(pts)/10000).toFixed(2)} m²</b></div>
     <div class="stat"><span>Internal size</span><b>${fmt(bb.w)} × ${fmt(bb.h)} cm</b></div>
     <div class="stat"><span>External size</span><b>${fmt(ob.w)} × ${fmt(ob.h)} cm</b></div>`;
}

function refreshList(){
  if (!state.objects.length){
    objList.innerHTML='<div class="empty" style="padding:12px 0">No objects yet.<br>Use <b>Add object</b> and drag.</div>';
    return;
  }
  objList.innerHTML = state.objects.map(o=>{
    const isSel = state.sel && state.sel.kind==='object' && state.sel.id===o.id;
    const lk = (o.locked||o.lockedSize) ? '<span style="color:var(--lock)">&#128274;</span>' : '';
    return `<div class="item ${isSel?'sel':''}" data-id="${o.id}">
      <span class="dot" style="background:${o.color};box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)"></span>
      <span class="nm">${esc(o.name||'Object')}</span>
      <span style="color:var(--muted);font-size:11px">${fmt(o.w)}×${fmt(o.h)}</span>${lk}</div>`;
  }).join('');
  objList.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click',()=>{ setTool('select'); select({kind:'object',id:el.dataset.id}); draw(); });
  });
}

/* ======================================================================
   TOOLBAR
   ====================================================================== */
function setTool(t){
  if (t==='room' && hasRoom() && tool!=='room'){
    if (!confirm('Draw a new room outline? This replaces the current room shape.')) return;
    state.room.pts=[]; state.sel=null; drawPts=null;
  }
  if (t!=='room'){ drawPts=null; hoverPt=null; }
  tool=t;
  document.querySelectorAll('#tools .tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  cv.style.cursor = t==='select'?'default':'crosshair';
  if (t==='room') showHint('Click each corner — walls snap to horizontal or vertical. Click the first corner again (or double-click) to close it.',0);
  else if (t==='object') showHint('Drag inside the room to place an object.');
  else hideHint();
  syncPanel(); draw();
}
document.querySelectorAll('#tools .tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));

document.getElementById('snapGrid').addEventListener('change',e=>state.snapGrid=e.target.checked);
document.getElementById('gridSize').addEventListener('change',e=>{
  const v=parseFloat(e.target.value);
  state.gridCm=(!isNaN(v)&&v>0)?v:10;
  e.target.value=state.gridCm; draw();
});

window.addEventListener('keydown',e=>{
  shiftDown = e.shiftKey;              // read by the rotation slider, so track it even while typing
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.code==='Space'&&!typing){spaceDown=true;if(!drag)cv.style.cursor='grab';e.preventDefault();}
  if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')&&!typing){
    e.preventDefault(); e.shiftKey?redo():undo(); return;
  }
  if((e.metaKey||e.ctrlKey)&&(e.key==='y'||e.key==='Y')&&!typing){ e.preventDefault(); redo(); return; }
  if(typing)return;
  if(e.key==='Enter'&&tool==='room'&&drawPts&&drawPts.length>=3){finishRoom();return;}
  if(e.key==='Escape'){
    if(tool==='room'&&drawPts){drawPts=null;hoverPt=null;setTool('select');}
    select(null); draw();
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(state.sel&&state.sel.kind==='object'){e.preventDefault();delObject(state.sel.id);}
  }
});
window.addEventListener('keyup',e=>{
  shiftDown = e.shiftKey;
  if(e.code==='Space'){spaceDown=false;if(!drag)cv.style.cursor=tool==='select'?'default':'crosshair';}
});

/* ---------------- zoom ---------------- */
function updZoom(){ zoomVal.textContent=Math.round(view.z*100)+'%'; }
function zoomBy(f){
  const W=cv.width/dpr,H=cv.height/dpr;
  const c={x:wx(W/2),y:wy(H/2)};
  view.z=Math.min(8,Math.max(0.03,view.z*f));
  view.x=c.x-(W/2)/(PX_PER_CM*view.z);
  view.y=c.y-(H/2)/(PX_PER_CM*view.z);
  updZoom(); draw();
}
document.getElementById('zIn').addEventListener('click',()=>zoomBy(1.25));
document.getElementById('zOut').addEventListener('click',()=>zoomBy(0.8));
document.getElementById('zFit').addEventListener('click',fit);

function contentBounds(){
  let pts = [];
  if (hasRoom()){ const ob=outerBounds(state.room.pts);   // include the wall band
    pts.push({x:ob.x,y:ob.y},{x:ob.x+ob.w,y:ob.y+ob.h}); }
  state.objects.forEach(o=>{objCorners(o).forEach(c=>pts.push(c));});
  if(!pts.length) return null;
  return polyBounds(pts);
}
function fit(){
  const bb=contentBounds();
  const W=cv.width/dpr,H=cv.height/dpr;
  if(!bb){ view.z=1; view.x=-W/2; view.y=-H/2; updZoom(); draw(); return; }
  const pad=60;
  const z=Math.min(W/(bb.w+pad*2), H/(bb.h+pad*2));
  view.z=Math.min(8,Math.max(0.03,z));
  view.x=bb.x+bb.w/2-(W/2)/(PX_PER_CM*view.z);
  view.y=bb.y+bb.h/2-(H/2)/(PX_PER_CM*view.z);
  updZoom(); draw();
}

/* ---------------- save / load / export ---------------- */
document.getElementById('btnSave').addEventListener('click',()=>{
  const data={format:'roomplan',version:2,units:'cm',gridCm:state.gridCm,
    room:{name:state.room.name,pts:state.room.pts,wall:state.room.wall,
          locked:state.room.locked,lockedSize:state.room.lockedSize},
    objects:state.objects};
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'room-'+stamp()+'.json');
  showHint('Plan saved.');
});
document.getElementById('btnLoad').addEventListener('click',()=>document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  let squaredOnLoad=false;
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!d.room||!Array.isArray(d.room.pts)) throw new Error('bad');
      const raw=d.room.pts.map(p=>({x:+p.x,y:+p.y,fix:!!p.fix}));
      const sq=rectify(raw);
      state.room={name:d.room.name||'Room', pts:sq,
                  locked:!!d.room.locked, lockedSize:!!d.room.lockedSize,
                  wall:d.room.wall==null?DEFAULT_WALL:Math.max(0,+d.room.wall||0)};
      if(sq.length!==raw.length || raw.some((p,k)=>Math.abs(p.x-sq[k].x)>EPS||Math.abs(p.y-sq[k].y)>EPS))
        squaredOnLoad=true;
      state.objects=(d.objects||[]).map(o=>Object.assign({color:COLORS[0],locked:false,lockedSize:false},o,
                                                          {id:uid(), rot:normRot(o.rot)}));
      if(d.gridCm){state.gridCm=d.gridCm;document.getElementById('gridSize').value=d.gridCm;}
      state.sel=null; drawPts=null;
      refreshList(); updStats(); syncPanel(); fit(); commit();
      showHint(squaredOnLoad
        ? 'Loaded — some walls were not square, so the outline was straightened to '+state.room.pts.length+' corners.'
        : 'Loaded room with '+state.room.pts.length+' corners and '+state.objects.length+' object(s).', squaredOnLoad?5200:0);
    }catch(err){ showHint('That file is not a valid room plan.'); }
    e.target.value='';
  };
  rd.readAsText(f);
});
document.getElementById('btnPng').addEventListener('click',()=>{
  const bb=contentBounds();
  if(!bb){showHint('Nothing to export yet.');return;}
  const sv={x:view.x,y:view.y,z:view.z}, ss=state.sel;
  const sw=cv.width, sh=cv.height, sd=dpr;
  const pad=50, scale=2, z=Math.min(2, 900/Math.max(bb.w,bb.h));
  const W=Math.round((bb.w+pad*2)*z), H=Math.round((bb.h+pad*2)*z);
  state.sel=null; dpr=scale;
  cv.width=W*scale; cv.height=H*scale;
  view.z=z; view.x=bb.x-pad; view.y=bb.y-pad;
  draw();
  cv.toBlob(b=>{
    dl(b,'room-'+stamp()+'.png');
    cv.width=sw; cv.height=sh; dpr=sd;
    Object.assign(view,sv); state.sel=ss;
    draw(); showHint('PNG exported.');
  },'image/png');
});
document.getElementById('btnClear').addEventListener('click',()=>{
  if(!hasRoom()&&!state.objects.length)return;
  if(!confirm('Clear the room and all objects?'))return;
  state.room={pts:[],locked:false,lockedSize:false,name:'Room',wall:state.room.wall};
  state.objects=[]; state.sel=null; drawPts=null;
  refreshList(); updStats(); syncPanel(); draw();
});

function dl(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}

/* ---------------- demo (an L-shaped room) ---------------- */
function demo(){
  state.room.name='Living Room';
  state.room.pts=[{x:0,y:0},{x:520,y:0},{x:520,y:300},{x:320,y:300},{x:320,y:460},{x:0,y:460}]
    .map(p=>({x:p.x,y:p.y,fix:false}));
  state.objects.push({id:uid(),name:'Sofa',x:40,y:340,w:220,h:90,rot:0,color:COLORS[0],locked:false,lockedSize:false});
  state.objects.push({id:uid(),name:'Table',x:120,y:120,w:140,h:80,rot:0,color:COLORS[1],locked:false,lockedSize:false});
  state.objects.push({id:uid(),name:'Cabinet',x:380,y:30,w:110,h:45,rot:0,color:COLORS[2],locked:false,lockedSize:false});
}

/* scripting hook for tests */
window.RoomPlan={
  state, view, select, setTool, draw, fit, objById, delObject, finishRoom,
  polyArea, polyPerimeter, startRename, PX_PER_CM,
  toWorld, toLocal, objCorners, resizeCursor, normRot,
  undo, redo, commit, hist, wallCm, outerBounds, polyBounds, contentBounds,
  wallAxis, wallLen, wallDir, absorberFor, setWallLength, blockingWalls,
  rectify, dedupe, moveCorner, addJog, removeCorner, axisSnap, isPinned,
  get tool(){return tool;},
  get drawPts(){return drawPts;},
  addObject(x,y,w,h,o){const n=Object.assign({id:uid(),name:'Object',x,y,w,h,rot:0,color:COLORS[0],locked:false,lockedSize:false},o||{});
    state.objects.push(n);refreshList();draw();return n;}
};

demo();
resize();
fit();
updZoom();
refreshList();
updStats();
syncPanel();
commit();                          // baseline: the starting plan
showHint('Wall lengths are internal — measured inside face to inside face. Select a wall to set its length, and pin the ones you want kept.',5200);
})();
</script>
